<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#000000">
	<title>Krantenwijk</title>

	<style>
		* {
			box-sizing: border-box;
		}

		html {
			background: #000;
			overscroll-behavior: none;
		}

		body {
			background: #000;
			color: snow;
			font-family: Arial, sans-serif;
			margin: 20px;
			overscroll-behavior: none;
		}

		/*
			Prevent the page behind a popup from scrolling.
			The JavaScript also locks the body on iOS where
			overflow:hidden alone is not always enough.
		*/
		body.modal-open {
			overflow: hidden;
			position: fixed;
			width: 100%;
			left: 0;
		}

		h1 select {
			background: #002222;
			color: white;
			border: 2px solid turquoise;
			border-radius: 8px;
			font-size: 22px;
			padding: 4px 10px;
			margin-left: 15px;
			position: relative;
		}

		h1, h2 {
			color: turquoise;
		}

		h1 {
			padding-bottom: 10px;
		}

		#dayView {
			position: relative;
			bottom: 3px;
		}

		.controls {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
			align-items: center;
			margin-bottom: 20px;
		}

		input, select, button {
			height: 40px;
			border: 2px solid turquoise;
			border-radius: 8px;
			background: #002222;
			color: white;
			padding: 0 10px;
			font-size: 16px;
		}

		button {
			cursor: pointer;
			touch-action: manipulation;
		}

		button:hover {
			background: #004444;
		}

		button:disabled {
			opacity: 0.4;
			cursor: default;
		}

		#referenceContainer {
			display: none;
		}

		ul {
			list-style: none;
			padding: 0;
		}

		li {
			width: max-content;
			min-width: 300px;
			height: 30px;
			padding: 8px 15px;
			border: 2px solid turquoise;
			background: #002222;
			border-radius: 10px;
			margin-bottom: 8px;
			display: flex;
			align-items: center;
			justify-content: space-between;
		}

		.houseLeft {
			display: flex;
			align-items: center;
			gap: 10px;
			user-select: none;
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
		}

		input[type="checkbox"] {
			width: 22px;
			height: 22px;
		}

		.deleteHouse {
			border-color: red;
			background: #220000;
			height: 35px;
		}

		.deleteHouse:hover {
			background: #550000;
		}

		/*
			The overlay itself never scrolls.
			Only .importBox is allowed to scroll.
		*/
		#importPopup,
		#exportPopup,
		#statsPopup,
		#reorderPopup {
			display: none;
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			background: rgba(0,0,0,0.7);
			align-items: center;
			justify-content: center;
			z-index: 1000;
			padding: 15px;
			overflow: hidden;
			overscroll-behavior: contain;
			touch-action: none;
		}

		.importBox {
			background: #002222;
			border: 2px solid turquoise;
			border-radius: 12px;
			padding: 20px;
			width: min(500px, 90%);
			max-height: 90vh;
			overflow-y: auto;
			overflow-x: hidden;
			overscroll-behavior: contain;
			-webkit-overflow-scrolling: touch;
			touch-action: pan-y;
		}

		.importBox h2 {
			margin-top: 0;
		}

		#importText {
			width: 100%;
			height: 180px;
			resize: vertical;
			box-sizing: border-box;
			margin-bottom: 15px;
			background-color: #000000;
			color: snow;
		}

		.importOptions {
			display: flex;
			gap: 10px;
			margin-bottom: 15px;
			flex-wrap: wrap;
		}

		.importButtons {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
		}

		summary.header {
			display: flex;
			align-items: center;
			gap: 20px;
			cursor: pointer;
		}

		summary.header h1 {
			margin: 0;
		}

		summary.header select {
			margin-left: 10px;
		}

		#importFile {
			margin-bottom: 15px;
		}

		.file-upload {
			display: flex;
			align-items: center;
			gap: 12px;
			margin-top: 10px;
			margin-bottom: 15px;
			padding: 10px;
			width: fit-content;
			border: 2px solid #20e0d0;
			border-radius: 10px;
		}

		.file-button {
			background: #000;
			color: #eee;
			border: 2px solid #20e0d0;
			padding: 8px 14px;
			border-radius: 8px;
			cursor: pointer;
			font-size: 16px;
		}

		.file-button:hover {
			background: #20e0d0;
			color: #000;
		}

		#fileName {
			color: #aaa;
			font-size: 16px;
		}

		.streetHeading {
			user-select: none;
			-webkit-user-select: none;
			cursor: default;
			touch-action: manipulation;
		}

		.streetHint {
			color: #777;
			font-size: 13px;
			margin-top: -5px;
		}

		.reorderItem {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-bottom: 8px;
		}

		.reorderName {
			flex: 1;
			padding: 11px;
			border: 2px solid turquoise;
			border-radius: 8px;
			background: #000;
			cursor: grab;
			user-select: none;
		}

		.reorderItem.dragging {
			opacity: 0.4;
		}

		.reorderMove {
			min-width: 42px;
			padding: 0;
		}

		.streetDropTarget {
			border-top: 3px solid turquoise;
		}

		.dayChoices {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			margin: 10px 0 15px;
		}

		.dayChoice {
			display: flex;
			align-items: center;
			gap: 6px;
			padding: 7px 9px;
			border: 2px solid turquoise;
			border-radius: 8px;
			background: #000;
			cursor: pointer;
		}

		.dayChoice input {
			width: 18px;
			height: 18px;
			margin: 0;
		}

		.dayChoice.all {
			border-color: #20e0d0;
		}

		@media (max-width: 600px) {
			body {
				margin: 10px;
			}

			.summary.header {
				gap: 10px;
				flex-wrap: wrap;
			}

			.summary.header h1 {
				font-size: 26px;
			}

			.summary.header select {
				margin-left: 0;
			}

			.controls {
				gap: 7px;
			}

			input,
			select,
			button {
				height: 38px;
				font-size: 15px;
			}

			li {
				width: 100%;
				min-width: 0;
				height: auto;
				min-height: 46px;
				padding: 7px 10px;
			}

			.houseLeft {
				min-width: 0;
			}

			.houseLeft label {
				overflow-wrap: anywhere;
			}

			.importBox {
				width: calc(100% - 10px);
				max-height: 90vh;
				padding: 15px;
			}

			.importButtons button {
				flex: 1 1 auto;
			}

			.dayChoice {
				flex: 1 1 auto;
			}

			.reorderMove {
				min-width: 38px;
			}
		}
	</style>
</head>

<body>

	<div>
		<details>
			<summary class="header">
				<h1>Krantenwijk</h1>

				<select id="dayView">
					<option value="mawo">Ma-Wo</option>
					<option value="dovr">Do-Vr</option>
					<option value="za">Za</option>
					<option value="f">F</option>
				</select>
			</summary>

			<div class="controls">
				<select id="street"></select>
				<button id="addStreet">+ Street</button>
				<button id="removeStreet">- Street</button>

				<input
					type="number"
					id="houseNumber"
					placeholder="House number"
				>

				<select id="krant">
					<option>VK</option>
					<option>HD</option>
					<option>NRC</option>
					<option>YC</option>
					<option>HFD</option>
					<option>TEL</option>
					<option>TR</option>
					<option>HP</option>
					<option>AD</option>
					<option>NYT</option>
					<option>F</option>
				</select>

				<select id="action">
					<option value="add">Add</option>
					<option value="bij">Bij</option>
					<option value="af">Af</option>
				</select>

				<select id="days">
					<option value="mawo">Ma-Wo</option>
					<option value="week">Ma-Za</option>
					<option value="dovr">Do-Vr</option>
					<option value="doza">Do-Za</option>
					<option value="za">Za</option>
					<option value="f">F</option>
				</select>

				<span id="referenceContainer">
					<select id="reference"></select>
				</span>

				<button id="submit">Submit</button>
				<button id="exportData">Export</button>
				<button id="importData">Import</button>
				<button id="statsButton">Stats</button>
				<button id="clearChecked">Clear Checked</button>
			</div>
		</details>

		<ul id="houseList"></ul>
	</div>

	<div id="importPopup">
		<div class="importBox">
			<h2>Import Route</h2>

			<textarea
				id="importText"
				placeholder="Paste exported route here"
			></textarea>

			<div class="file-upload">
				<input
					type="file"
					id="importFile"
					accept=".json"
					hidden
				>

				<label
					for="importFile"
					class="file-button"
				>
					Choose route file
				</label>

				<span id="fileName">
					No file selected
				</span>
			</div>

			<strong>Days to import:</strong>

			<div class="dayChoices" id="importDayChoices">
				<label class="dayChoice all">
					<input
						type="checkbox"
						value="all"
						id="importAllDays"
					>
					All
				</label>

				<label class="dayChoice">
					<input type="checkbox" value="mawo">
					Ma-Wo
				</label>

				<label class="dayChoice">
					<input type="checkbox" value="dovr">
					Do-Vr
				</label>

				<label class="dayChoice">
					<input type="checkbox" value="za">
					Za
				</label>

				<label class="dayChoice">
					<input type="checkbox" value="f">
					F
				</label>
			</div>

			<div class="importOptions">
				<select id="importMode">
					<option value="replace">Replace</option>
					<option value="add">Add</option>
				</select>
			</div>

			<div class="importButtons">
				<button id="cancelImport">Cancel</button>
				<button id="confirmImport">Import</button>
			</div>
		</div>
	</div>

	<div id="exportPopup">
		<div class="importBox">
			<h2>Export Route</h2>
			<p>Choose which days you want to export.</p>

			<div class="dayChoices" id="exportDayChoices">
				<label class="dayChoice all">
					<input
						type="checkbox"
						value="all"
						id="exportAllDays"
						checked
					>
					All
				</label>

				<label class="dayChoice">
					<input type="checkbox" value="mawo" checked>
					Ma-Wo
				</label>

				<label class="dayChoice">
					<input type="checkbox" value="dovr" checked>
					Do-Vr
				</label>

				<label class="dayChoice">
					<input type="checkbox" value="za" checked>
					Za
				</label>

				<label class="dayChoice">
					<input type="checkbox" value="f" checked>
					F
				</label>
			</div>

			<div class="importButtons">
				<button id="copyExport">
					Copy to Clipboard
				</button>

				<button id="downloadExport">
					Download JSON
				</button>
			</div>

			<br>

			<div class="importButtons">
				<button id="cancelExport">Cancel</button>
			</div>
		</div>
	</div>

	<div id="statsPopup">
		<div class="importBox">
			<h2>Route Statistics</h2>

			<select id="statsDay">
				<option value="mawo">Ma-Wo</option>
				<option value="dovr">Do-Vr</option>
				<option value="za">Za</option>
				<option value="f">F</option>
			</select>

			<br><br>

			<div id="statsContent"></div>

			<br>

			<div class="importButtons">
				<button id="closeStats">Close</button>
			</div>
		</div>
	</div>

	<div id="reorderPopup">
		<div class="importBox">
			<h2>Reorder Streets</h2>

			<p id="reorderHint">
				Choose which days this order should be changed for.
			</p>

			<div class="dayChoices" id="reorderDayChoices">
				<label class="dayChoice">
					<input type="checkbox" value="mawo">
					Ma-Wo
				</label>

				<label class="dayChoice">
					<input type="checkbox" value="dovr">
					Do-Vr
				</label>

				<label class="dayChoice">
					<input type="checkbox" value="za">
					Za
				</label>

				<label class="dayChoice">
					<input type="checkbox" value="f">
					F
				</label>
			</div>

			<div id="reorderList"></div>

			<br>

			<div class="importButtons">
				<button id="cancelReorder">Cancel</button>
				<button id="saveReorder">Save Order</button>
			</div>
		</div>
	</div>

	<script>
		let streets = [];
		let houses = [];

		const DAYS = ["mawo", "dovr", "za", "f"];

		let streetOrders = {
			mawo: [],
			dovr: [],
			za: [],
			f: []
		};

		const street = document.getElementById("street");
		const addStreet = document.getElementById("addStreet");
		const removeStreet = document.getElementById("removeStreet");
		const houseNumber = document.getElementById("houseNumber");
		const krant = document.getElementById("krant");
		const action = document.getElementById("action");
		const days = document.getElementById("days");
		const reference = document.getElementById("reference");
		const referenceContainer =
			document.getElementById("referenceContainer");
		const submit = document.getElementById("submit");
		const houseList = document.getElementById("houseList");
		const dayView = document.getElementById("dayView");

		const exportData = document.getElementById("exportData");
		const importData = document.getElementById("importData");
		const importPopup = document.getElementById("importPopup");
		const importText = document.getElementById("importText");
		const importMode = document.getElementById("importMode");
		const confirmImport =
			document.getElementById("confirmImport");
		const cancelImport =
			document.getElementById("cancelImport");

		const exportPopup = document.getElementById("exportPopup");
		const copyExport = document.getElementById("copyExport");
		const downloadExport =
			document.getElementById("downloadExport");
		const cancelExport =
			document.getElementById("cancelExport");
		const importFile =
			document.getElementById("importFile");

		const clearChecked =
			document.getElementById("clearChecked");
		const statsButton =
			document.getElementById("statsButton");
		const statsPopup =
			document.getElementById("statsPopup");
		const statsDay =
			document.getElementById("statsDay");
		const statsContent =
			document.getElementById("statsContent");
		const closeStats =
			document.getElementById("closeStats");

		const reorderPopup =
			document.getElementById("reorderPopup");
		const reorderList =
			document.getElementById("reorderList");
		const reorderHint =
			document.getElementById("reorderHint");
		const cancelReorder =
			document.getElementById("cancelReorder");
		const saveReorder =
			document.getElementById("saveReorder");

		const importAllDays =
			document.getElementById("importAllDays");
		const exportAllDays =
			document.getElementById("exportAllDays");

		const importDayChoices =
			document.getElementById("importDayChoices");

		const exportDayChoices =
			document.getElementById("exportDayChoices");

		const reorderDayChoices =
			document.getElementById("reorderDayChoices");

		let reorderDay = null;
		let reorderDays = [];
		let reorderTemp = [];
		let longPressTimer = null;

		/*
			Used to restore the exact page position after a popup closes.
			This is especially important on iPhone/iPad.
		*/
		let lockedScrollY = 0;

		function lockPageScroll() {
			if (document.body.classList.contains("modal-open")) {
				return;
			}

			lockedScrollY =
				window.scrollY ||
				document.documentElement.scrollTop ||
				0;

			document.body.style.top =
				`-${lockedScrollY}px`;

			document.body.classList.add("modal-open");
		}

		function unlockPageScroll() {
			if (!document.body.classList.contains("modal-open")) {
				return;
			}

			document.body.classList.remove("modal-open");
			document.body.style.top = "";

			window.scrollTo(0, lockedScrollY);
		}

		function openPopup(popup) {
			popup.style.display = "flex";
			lockPageScroll();
		}

		function closePopup(popup) {
			popup.style.display = "none";

			if (
				!document.querySelector(
					'#importPopup[style*="display: flex"], ' +
					'#exportPopup[style*="display: flex"], ' +
					'#statsPopup[style*="display: flex"], ' +
					'#reorderPopup[style*="display: flex"]'
				)
			) {
				unlockPageScroll();
			}
		}

		function emptyStreetOrders() {
			return {
				mawo: [],
				dovr: [],
				za: [],
				f: []
			};
		}

		function saveData() {
			localStorage.setItem(
				"streets",
				JSON.stringify(streets)
			);

			localStorage.setItem(
				"houses",
				JSON.stringify(houses)
			);

			localStorage.setItem(
				"streetOrders",
				JSON.stringify(streetOrders)
			);
		}

		function ensureHouseStructure(house) {
			if (Array.isArray(house.kranten)) {
				house.kranten = {
					mawo: house.kranten,
					dovr: [],
					za: [],
					f: []
				};
			}

			if (
				!house.kranten ||
				typeof house.kranten !== "object"
			) {
				house.kranten = {
					mawo: [],
					dovr: [],
					za: [],
					f: []
				};
			}

			DAYS.forEach(day => {
				if (!Array.isArray(house.kranten[day])) {
					house.kranten[day] = [];
				}
			});

			if (typeof house.checked === "boolean") {
				house.checked = {
					mawo: house.checked,
					dovr: false,
					za: false,
					f: false
				};
			}

			if (
				!house.checked ||
				typeof house.checked !== "object"
			) {
				house.checked = {
					mawo: false,
					dovr: false,
					za: false,
					f: false
				};
			}

			DAYS.forEach(day => {
				if (typeof house.checked[day] !== "boolean") {
					house.checked[day] = false;
				}
			});
		}

		function streetIsUsedOnDay(streetName, day) {
			return houses.some(house =>
				house.street === streetName &&
				Array.isArray(house.kranten?.[day]) &&
				house.kranten[day].length > 0
			);
		}

		function buildOrderFromHouseUsage(day) {
			const result = [];

			houses.forEach(house => {
				if (
					!result.includes(house.street) &&
					streetIsUsedOnDay(
						house.street,
						day
					)
				) {
					result.push(house.street);
				}
			});

			return result;
		}

		function normalizeStreetOrders() {
			DAYS.forEach(day => {
				if (!Array.isArray(streetOrders[day])) {
					streetOrders[day] = [];
				}

				const used = new Set(
					houses
						.filter(h =>
							streetIsUsedOnDay(
								h.street,
								day
							)
						)
						.map(h => h.street)
				);

				streetOrders[day] =
					streetOrders[day].filter(
						name =>
							streets.includes(name) &&
							used.has(name)
					);

				buildOrderFromHouseUsage(day)
					.forEach(name => {
						if (
							!streetOrders[day]
								.includes(name)
						) {
							streetOrders[day]
								.push(name);
						}
					});
			});
		}

		function loadData() {
			const savedStreets =
				localStorage.getItem("streets");

			const savedHouses =
				localStorage.getItem("houses");

			const savedStreetOrders =
				localStorage.getItem("streetOrders");

			if (savedStreets) {
				try {
					streets = JSON.parse(savedStreets);

					if (!Array.isArray(streets)) {
						streets = [];
					}
				} catch {
					streets = [];
				}
			}

			if (savedHouses) {
				try {
					houses = JSON.parse(savedHouses);

					if (!Array.isArray(houses)) {
						houses = [];
					}
				} catch {
					houses = [];
				}

				houses.forEach(ensureHouseStructure);
			}

			let hadStreetOrders = false;

			if (savedStreetOrders) {
				try {
					const parsed =
						JSON.parse(savedStreetOrders);

					if (
						parsed &&
						typeof parsed === "object"
					) {
						streetOrders = parsed;
						hadStreetOrders = true;
					}
				} catch {
					streetOrders =
						emptyStreetOrders();
				}
			}

			if (!hadStreetOrders) {
				streetOrders =
					emptyStreetOrders();

				DAYS.forEach(day => {
					streetOrders[day] =
						buildOrderFromHouseUsage(day);
				});
			}

			/*
				Fix old versions where every day contained
				every global street in the same order.
			*/
			DAYS.forEach(day => {
				const order =
					Array.isArray(streetOrders[day])
						? streetOrders[day]
						: [];

				const allExisting =
					order.length === streets.length &&
					streets.every(name =>
						order.includes(name)
					);

				if (allExisting) {
					streetOrders[day] =
						buildOrderFromHouseUsage(day);
				}
			});

			normalizeStreetOrders();
			saveData();
		}

		function getOrderedStreets(day) {
			normalizeStreetOrders();

			return streetOrders[day].filter(name =>
				streetIsUsedOnDay(name, day)
			);
		}

		function addStreetToDayOrder(day, streetName) {
			if (
				!Array.isArray(streetOrders[day])
			) {
				streetOrders[day] = [];
			}

			if (
				!streetOrders[day]
					.includes(streetName)
			) {
				streetOrders[day]
					.push(streetName);
			}
		}

		function removeStreetFromDayIfUnused(
			day,
			streetName
		) {
			if (
				!streetIsUsedOnDay(
					streetName,
					day
				)
			) {
				streetOrders[day] =
					streetOrders[day].filter(
						name =>
							name !== streetName
					);
			}
		}

		function updateStats() {
			const day = statsDay.value;

			const counts = {
				VK: 0,
				HD: 0,
				NRC: 0,
				YC: 0,
				HFD: 0,
				TEL: 0,
				TR: 0,
				HP: 0,
				AD: 0,
				NYT: 0,
				F: 0
			};

			let total = 0;
			let houseCount = 0;

			houses.forEach(house => {
				ensureHouseStructure(house);

				if (
					house.kranten[day].length > 0
				) {
					houseCount++;
				}

				house.kranten[day]
					.forEach(paper => {
						if (
							counts[paper] !==
							undefined
						) {
							counts[paper]++;
						}

						total++;
					});
			});

			let html =
				`<div style="font-size:17px;">`;

			Object.entries(counts)
				.sort(
					(a, b) =>
						b[1] - a[1]
				)
				.filter(
					([, amount]) =>
						amount > 0
				)
				.forEach(
					([paper, amount]) => {
						html += `
							<div style="
								display:flex;
								justify-content:space-between;
								align-items:center;
								padding:6px 0;
								border-bottom:1px solid rgba(64,224,208,.2);
							">
								<span>${paper}</span>
								<strong>${amount}</strong>
							</div>
						`;
					}
				);

			html += `
				</div>

				<hr style="
					border-color:turquoise;
					margin:16px 0;
				">

				<div style="
					display:flex;
					justify-content:space-between;
					padding:4px 0;
				">
					<span>Total papers</span>
					<strong>${total}</strong>
				</div>

				<div style="
					display:flex;
					justify-content:space-between;
					padding:4px 0;
				">
					<span>Houses</span>
					<strong>${houseCount}</strong>
				</div>

				<div style="
					display:flex;
					justify-content:space-between;
					padding:4px 0;
				">
					<span>Average / house</span>
					<strong>
						${
							houseCount
								? (
									total /
									houseCount
								).toFixed(2)
								: "0.00"
						}
					</strong>
				</div>
			`;

			statsContent.innerHTML = html;
		}

		function getExportObject(selectedDays) {
			const exportedHouses =
				houses.map(house => {
					ensureHouseStructure(
						house
					);

					const copy = {
						street:
							house.street,
						number:
							house.number,
						checked: {},
						kranten: {}
					};

					DAYS.forEach(day => {
						if (
							selectedDays.includes(
								day
							)
						) {
							copy.kranten[day] =
								[
									...house
										.kranten[
											day
										]
								];

							copy.checked[day] =
								house.checked[
									day
								];
						} else {
							copy.kranten[day] =
								[];

							copy.checked[day] =
								false;
						}
					});

					return copy;
				});

			const exportedOrders =
				emptyStreetOrders();

			selectedDays.forEach(day => {
				exportedOrders[day] =
					[
						...getOrderedStreets(
							day
						)
					];
			});

			return {
				version: 4,
				streets: [...streets],
				houses: exportedHouses,
				streetOrders:
					exportedOrders,
				days: selectedDays
			};
		}

				return null;

			return selected;
		}

		function downloadRoute() {
			const selectedDays =
				getExportDays();

			if (!selectedDays) {
				return;
			}

			const text =
				JSON.stringify(
					getExportObject(
						selectedDays
					),
					null,
					2
				);

			const blob = new Blob(
				[text],
				{
					type:
						"application/json"
				}
			);

			const url =
				URL.createObjectURL(
					blob
				);

			const a =
				document.createElement(
					"a"
				);

			a.href = url;
			a.download =
				"krantenwijk-backup.json";

			document.body.appendChild(a);
			a.click();
			a.remove();

			setTimeout(() => {
				URL.revokeObjectURL(
					url
				);
			}, 1000);

			closePopup(exportPopup);
		}

		function moveReorderItem(
			index,
			direction
		) {
			const newIndex =
				index + direction;

			if (
				newIndex < 0 ||
				newIndex >=
					reorderTemp.length
			) {
				return;
			}

			[
				reorderTemp[index],
				reorderTemp[newIndex]
			] = [
				reorderTemp[newIndex],
				reorderTemp[index]
			];

			renderReorderList();
		}

		function renderReorderList() {
			reorderList.innerHTML = "";

			reorderTemp.forEach(
				(streetName, index) => {
					const item =
						document.createElement(
							"div"
						);

					item.className =
						"reorderItem";

					item.dataset.street =
						streetName;

					const name =
						document.createElement(
							"div"
						);

					name.className =
						"reorderName";

					name.textContent =
						`${index + 1}. ${streetName}`;

					name.draggable = true;

					const up =
						document.createElement(
							"button"
						);

					up.className =
						"reorderMove";

					up.textContent = "↑";
					up.title =
						"Move up";

					up.disabled =
						index === 0;

					const down =
						document.createElement(
							"button"
						);

					down.className =
						"reorderMove";

					down.textContent = "↓";
					down.title =
						"Move down";

					down.disabled =
						index ===
						reorderTemp.length -
							1;

					up.addEventListener(
						"click",
						() => {
							moveReorderItem(
								index,
								-1
							);
						}
					);

					down.addEventListener(
						"click",
						() => {
							moveReorderItem(
								index,
								1
							);
						}
					);

					let draggedStreet =
						null;

					name.addEventListener(
						"dragstart",
						event => {
							draggedStreet =
								streetName;

							item.classList.add(
								"dragging"
							);

							event.dataTransfer
								.effectAllowed =
								"move";

							event.dataTransfer
								.setData(
									"text/plain",
									streetName
								);
						}
					);

					name.addEventListener(
						"dragend",
						() => {
							item.classList.remove(
								"dragging"
							);
						}
					);

					item.addEventListener(
						"dragover",
						event => {
							event.preventDefault();

							item.classList.add(
								"streetDropTarget"
							);
						}
					);

					item.addEventListener(
						"dragleave",
						() => {
							item.classList.remove(
								"streetDropTarget"
							);
						}
					);

					item.addEventListener(
						"drop",
						event => {
							event.preventDefault();

							item.classList.remove(
								"streetDropTarget"
							);

							const dragged =
								event.dataTransfer
									.getData(
										"text/plain"
									) ||
								draggedStreet;

							if (
								!dragged ||
								dragged ===
									streetName
							) {
								return;
							}

							const from =
								reorderTemp.indexOf(
									dragged
								);

							const to =
								reorderTemp.indexOf(
									streetName
								);

							if (
								from === -1 ||
								to === -1
							) {
								return;
							}

							reorderTemp.splice(
								from,
								1
							);

							reorderTemp.splice(
								to,
								0,
								dragged
							);

							renderReorderList();
						}
					);

					item.appendChild(name);
					item.appendChild(up);
					item.appendChild(down);

					reorderList.appendChild(
						item
					);
				}
			);
		}

		function applyReorderToDay(
			day,
			desiredOrder
		) {
			const used =
				getOrderedStreets(day);

			const newOrder = [];

			desiredOrder.forEach(name => {
				if (
					used.includes(name) &&
					!newOrder.includes(name)
				) {
					newOrder.push(name);
				}
			});

			used.forEach(name => {
				if (
					!newOrder.includes(name)
				) {
					newOrder.push(name);
				}
			});

			streetOrders[day] =
				newOrder;
		}

		saveReorder.addEventListener(

				}

				const selectedDays =
					getReorderDays();

				if (

				) {
					alert(

					);

					return;
				}

				selectedDays.forEach(

				normalizeStreetOrders();

		function renderList() {
			houseList.innerHTML = "";

			const selectedDay =
				dayView.value;

			const orderedStreets =
				getOrderedStreets(
					selectedDay
				);

			let idCounter = 0;

			orderedStreets.forEach(
				streetName => {
					const visibleHouses =
						houses.filter(
							h => {
								ensureHouseStructure(
									h
								);

								return (
									h.street ===
										streetName &&
									h.kranten[
										selectedDay
									].length >
										0
								);
							}
						);

					if (
						!visibleHouses.length
					) {
						return;
					}

					const heading =
						document.createElement(
							"h2"
						);

					heading.textContent =
						streetName;

					heading.className =
						"streetHeading";

					/*
						Exactly 3 seconds.
						Pointer events work with
						mouse, touch and stylus.
					*/
					heading.addEventListener(
						"pointerdown",
						event => {
							if (
								event.button !==
									undefined &&
								event.button !==
									0
							) {
								return;
							}

							startLongPress(
								streetName
							);
						}
					);

					[
						"pointerup",
						"pointercancel",
						"pointerleave"
					].forEach(type => {
						heading.addEventListener(
							type,
							cancelLongPress
						);
					});

					heading.addEventListener(
						"contextmenu",
						event => {
							event.preventDefault();
						}
					);

					houseList.appendChild(
						heading
					);

					visibleHouses.forEach(
						house => {
							ensureHouseStructure(
								house
							);

							const li =
								document.createElement(
									"li"
								);

							const uniqueId =
								`chk-${idCounter++}`;

							li.innerHTML = `
								<div class="houseLeft">
									<input
										type="checkbox"
										id="${uniqueId}"
									>

									<label for="${uniqueId}">
										<strong>
											${house.number}
											${" "}
											${house.kranten[
												selectedDay
											].join("/")}
										</strong>
									</label>
								</div>

								<button class="deleteHouse">
									x
								</button>
							`;

							const checkbox =
								li.querySelector(
									"input"
								);

							checkbox.checked =
								house.checked[
									selectedDay
								];

							checkbox.addEventListener(
								"change",
								() => {
									house.checked[
										selectedDay
									] =
										checkbox.checked;

									saveData();
								}
							);

							li.querySelector(
								".deleteHouse"
							).addEventListener(
								"click",
								() => {
									const confirmed =
										confirm(
											`Delete house ${house.number} (${house.kranten[selectedDay].join("/")})?`
										);

									if (
										!confirmed
									) {
										return;
									}

									/*
										Keep the existing
										behavior: X deletes
										the complete house.
									*/
									houses.splice(
										houses.indexOf(
											house
										),
										1
									);

									normalizeStreetOrders();
									saveData();
									renderList();
								}
							);

							houseList.appendChild(
								li
							);
						}
					);
				}
			);

			renderReferenceList();
		}

		importFile.addEventListener(

				const file =
					importFile.files[0];

				updateFileName();

				if (!file) {
					return;
				}

				const reader =
					new FileReader();

				reader.onload = () => {
					importText.value =
						reader.result;
				};

				reader.readAsText(file);
			}
		);

		action.addEventListener(
			"change",
			() => {
				referenceContainer.style.display =
					action.value === "bij"
						? "inline"
						: "none";

				renderReferenceList();
			}
		);

		addStreet.addEventListener(
			"click",
			() => {
				const name =
					prompt(
						"Street name:"
					);

				if (!name) {
					return;
				}

				const cleanName =
					name.trim();

				if (!cleanName) {
					return;
				}

				if (
					streets.includes(
						cleanName
					)
				) {
					alert(
						"Street already exists."
					);

					return;
				}

				streets.push(
					cleanName
				);

				/*
					Do not add the street
					to every day.

					It enters a day's order
					when a house is added
					to that day.
				*/

				saveData();
				renderStreetList();

				street.value =
					cleanName;

				renderList();
			}
		);

		downloadExport.addEventListener(
			"click",
			downloadRoute
		);

		removeStreet.addEventListener(
			"click",
			() => {
				if (!street.value) {
					return;
				}

				const name =
					street.value;

				const amount =
					houses.filter(
						h =>
							h.street ===
							name
					).length;

				if (amount > 0) {
					if (
						!confirm(
							"This street still has houses. Delete everything?"
						)
					) {
						return;
					}

					houses =
						houses.filter(
							h =>
								h.street !==
								name
						);
				} else {
					if (
						!confirm(
							"Delete street?"
						)
					) {
						return;
					}
				}

				streets =
					streets.filter(
						streetName =>
							streetName !==
							name
					);

				DAYS.forEach(day => {
					streetOrders[day] =
						streetOrders[
							day
						].filter(
							streetName =>
								streetName !==
								name
						);
				});

				saveData();
				renderStreetList();
				renderList();
			}
		);

		street.addEventListener(
			"change",
			renderReferenceList
		);

		function getSelectedDayGroups() {
			switch (days.value) {
				case "mawo":
					return ["mawo"];

				case "week":
					return [
						"mawo",
						"dovr",
						"za"
					];

				case "dovr":
					return ["dovr"];

				case "doza":
					return [
						"dovr",
						"za"
					];

				case "za":
					return ["za"];

				case "f":
					return ["f"];

				default:
					return [];
			}
		}

		function importRoute(
			data,
			mode,
			selectedDays
		) {
			if (
				!data ||
				!Array.isArray(
					data.streets
				) ||
				!Array.isArray(
					data.houses
				)
			) {
				alert(
					"Invalid route data."
				);

				return;
			}

			const sourceDays =
				Array.isArray(data.days) &&
				data.days.length
					? data.days.filter(
							day =>
								DAYS.includes(
									day
								)
						)
					: DAYS;

			const daysToImport =
				selectedDays.filter(
					day =>
						sourceDays.includes(
							day
						)
				);

			if (
				daysToImport.length ===
				0
			) {
				alert(
					"The selected days are not present in this export."
				);

				return;
			}

			if (mode === "replace") {
				houses.forEach(
					ensureHouseStructure
				);

				houses.forEach(
					house => {
						daysToImport.forEach(
							day => {
								house.kranten[
									day
								] = [];

								house.checked[
									day
								] = false;
							}
						);
					}
				);

				houses =
					houses.filter(
						house =>
							DAYS.some(
								day =>
									house
										.kranten[
											day
										]
										.length >
									0
							)
					);

				daysToImport.forEach(
					day => {
						streetOrders[
							day
						] = [];
					}
				);
			}

			/*
				Keep the global street list.
				Importing can introduce
				new streets.
			*/
			data.streets.forEach(
				name => {
					if (
						typeof name ===
							"string" &&
						!streets.includes(
							name
						)
					) {
						streets.push(
							name
						);
					}
				}
			);

			/*
				Import saved per-day
				street orders first.
			*/
			if (
				data.streetOrders &&
				typeof data.streetOrders ===
					"object"
			) {
				daysToImport.forEach(
					day => {
						if (
							Array.isArray(
								data
									.streetOrders[
										day
									]
							)
						) {
							const importedOrder =
								data
									.streetOrders[
										day
									].filter(
										name =>
											streets.includes(
												name
											)
									);

							if (
								mode ===
								"replace"
							) {
								streetOrders[
									day
								] = [
									...importedOrder
								];
							} else {
								importedOrder.forEach(
									name => {
										if (
											!streetOrders[
												day
											].includes(
												name
											)
										) {
											streetOrders[
												day
											].push(
												name
											);
										}
									}
								);
							}
						}
					}
				);
			}

			data.houses.forEach(
				importedHouse => {
					if (
						!importedHouse ||
						typeof importedHouse.street !==
							"string"
					) {
						return;
					}

					ensureHouseStructure(
						importedHouse
					);

					const hasSelectedDayPapers =
						daysToImport.some(
							day =>
								importedHouse
									.kranten[
										day
									]
									.length >
								0
						);

					if (
						!hasSelectedDayPapers
					) {
						return;
					}

					let existing =
						houses.find(
							h =>
								h.street ===
									importedHouse.street &&
								h.number ==
									importedHouse.number
						);

					if (!existing) {
						existing = {
							street:
								importedHouse.street,
							number:
								importedHouse.number,
							checked: {
								mawo: false,
								dovr: false,
								za: false,
								f: false
							},
							kranten: {
								mawo: [],
								dovr: [],
								za: [],
								f: []
							}
						};

						houses.push(
							existing
						);
					}

					ensureHouseStructure(
						existing
					);

					daysToImport.forEach(
						day => {
							const importedPapers =
								Array.isArray(
									importedHouse
										.kranten[
											day
										]
								)
									? importedHouse
											.kranten[
												day
											]
									: [];

							importedPapers.forEach(
								paper => {
									if (
										!existing
											.kranten[
												day
											]
											.includes(
												paper
											)
									) {
										existing
											.kranten[
												day
											]
											.push(
												paper
											);
									}
								}
							);

							existing
								.kranten[
									day
								]
								.sort();

							if (
								existing
									.kranten[
										day
									]
									.length >
								0
							) {
								addStreetToDayOrder(
									day,
									existing.street
								);
							}

							if (
								importedHouse.checked &&
								typeof importedHouse
									.checked[
										day
									] ===
									"boolean"
							) {
								existing.checked[
									day
								] =
									importedHouse
										.checked[
											day
										];
							}
						}
					);
				}
			);

			daysToImport.forEach(
				day => {
					if (
						!Array.isArray(
							streetOrders[
								day
							]
						)
					) {
						streetOrders[
							day
						] =
							buildOrderFromHouseUsage(
								day
							);
					}
				}
			);

			normalizeStreetOrders();
			saveData();
			renderStreetList();
			renderList();

			alert("Import complete.");
		}

		submit.addEventListener(
			"click",
			() => {
				if (!street.value) {
					alert(
						"Add a street first."
					);

					return;
				}

				const number =
					houseNumber.value.trim();

				if (number === "") {
					alert(
						"Enter a house number."
					);

					return;
				}

				const selectedKrant =
					krant.value;

				const selectedDays =
					getSelectedDayGroups();

				if (
					selectedDays.length ===
					0
				) {
					return;
				}

				if (
					action.value ===
					"add"
				) {
					let existing =
						houses.find(
							h =>
								h.street ===
									street.value &&
								h.number ==
									number
						);

					if (existing) {
						ensureHouseStructure(
							existing
						);

						selectedDays.forEach(
							day => {
								if (
									!existing
										.kranten[
											day
										]
										.includes(
											selectedKrant
										)
								) {
									existing
										.kranten[
											day
										]
										.push(
											selectedKrant
										);

									existing
										.kranten[
											day
										]
										.sort();
								}
							}
						);
					} else {
						const newHouse = {
							street:
								street.value,
							number:
								number,
							checked: {
								mawo: false,
								dovr: false,
								za: false,
								f: false
							},
							kranten: {
								mawo: [],
								dovr: [],
								za: [],
								f: []
							}
						};

						selectedDays.forEach(
							day => {
								newHouse
									.kranten[
										day
									]
									.push(
										selectedKrant
									);
							}
						);

						houses.push(
							newHouse
						);
					}

					selectedDays.forEach(
						day => {
							addStreetToDayOrder(
								day,
								street.value
							);
						}
					);
				}

				else if (
					action.value ===
					"bij"
				) {
					let existing =
						houses.find(
							h =>
								h.street ===
									street.value &&
								h.number ==
									number
						);

					if (existing) {
						ensureHouseStructure(
							existing
						);

						selectedDays.forEach(
							day => {
								if (
									!existing
										.kranten[
											day
										]
										.includes(
											selectedKrant
										)
								) {
									existing
										.kranten[
											day
										]
										.push(
											selectedKrant
										);

									existing
										.kranten[
											day
										]
										.sort();
								}
							}
						);
					} else {
						const newHouse = {
							street:
								street.value,
							number:
								number,
							checked: {
								mawo: false,
								dovr: false,
								za: false,
								f: false
							},
							kranten: {
								mawo: [],
								dovr: [],
								za: [],
								f: []
							}
						};

						selectedDays.forEach(
							day => {
								newHouse
									.kranten[
										day
									]
									.push(
										selectedKrant
									);
							}
						);

						const referenceHouse =
							parseInt(
								reference.value
							);

						if (
							isNaN(
								referenceHouse
							)
						) {
							houses.push(
								newHouse
							);
						} else {
							houses.splice(
								referenceHouse,
								0,
								newHouse
							);
						}
					}

					/*
						Bij does not alter the
						existing street order.
					*/
					selectedDays.forEach(
						day => {
							addStreetToDayOrder(
								day,
								street.value
							);
						}
					);
				}

				else if (
					action.value ===
					"af"
				) {
					const existing =
						houses.find(
							h =>
								h.street ===
									street.value &&
								h.number ==
									number
						);

					if (!existing) {
						alert(
							"House not found."
						);

						return;
					}

					ensureHouseStructure(
						existing
					);

					selectedDays.forEach(
						day => {
							const index =
								existing
									.kranten[
										day
									]
									.indexOf(
										selectedKrant
									);

							if (
								index !== -1
							) {
								existing
									.kranten[
										day
									]
									.splice(
										index,
										1
									);
							}

							removeStreetFromDayIfUnused(
								day,
								existing.street
							);
						}
					);

					const hasAnyKranten =
						existing.kranten
							.mawo.length ||
						existing.kranten
							.dovr.length ||
						existing.kranten
							.za.length ||
						existing.kranten
							.f.length;

					if (!hasAnyKranten) {
						houses.splice(
							houses.indexOf(
								existing
							),
							1
						);
					}
				}

				normalizeStreetOrders();
				saveData();
				renderList();

				houseNumber.value = "";
				houseNumber.focus();
			}
		);

		exportData.addEventListener(
			"click",
			() => {
				setDayCheckboxes(
					exportDayChoices,
					DAYS
				);

				openPopup(exportPopup);
			}
		);

		cancelImport.addEventListener(
			"click",
			() => {
				closePopup(importPopup);
				importText.value = "";
			}
		);

		cancelExport.addEventListener(
			"click",
			() => {
				closePopup(exportPopup);
			}
		);

		confirmImport.addEventListener(
			"click",
			() => {
				const selectedDays =
					getCheckedDays(
						importDayChoices
					);

				if (
					selectedDays.length ===
					0
				) {
					alert(
						"Select at least one day."
					);

					return;
				}

				let data;

				try {
					data = JSON.parse(
						importText.value
					);
				} catch {
					alert(
						"Invalid route data."
					);

					return;
				}

				importRoute(
					data,
					importMode.value,
					selectedDays
				);

				closePopup(importPopup);

				importText.value = "";
			}
		);

		importData.addEventListener(
			"click",
			() => {
				setDayCheckboxes(
					importDayChoices,
					[dayView.value]
				);

				importText.value = "";
				importFile.value = "";

				document.getElementById(
					"fileName"
				).textContent =
					"No file selected";

				openPopup(importPopup);
			}
		);

		/*
			Clicking the dark area closes the popup.
			The popup itself remains the only scrollable area.
		*/
		[
			importPopup,
			exportPopup,
			statsPopup,
			reorderPopup
		].forEach(popup => {
			popup.addEventListener(
				"click",
				event => {
					if (
						event.target ===
						popup
					) {
						closePopup(
							popup
						);

						if (
							popup ===
							reorderPopup
						) {
							reorderDay =
								null;

							reorderDays =
								[];

							reorderTemp =
								[];
						}
					}
				}
			);
		});

		/*
			Extra safety:
			pressing Escape closes the currently
			open popup.
		*/
		document.addEventListener(
			"keydown",
			event => {
				if (
					event.key !==
					"Escape"
				) {
					return;
				}

				const popups = [
					importPopup,
					exportPopup,
					statsPopup,
					reorderPopup
				];

				const open =
					popups.find(
						popup =>
							getComputedStyle(
								popup
							).display ===
							"flex"
					);

				if (!open) {
					return;
				}

				closePopup(open);

				if (
					open ===
					reorderPopup
				) {
					reorderDay =
						null;

					reorderDays =
						[];

					reorderTemp =
						[];
				}
			}
		);

		loadData();

		const today =
			new Date().getDay();

		if (
			today >= 1 &&
			today <= 3
		) {
			dayView.value =
				"mawo";
		} else if (
			today >= 4 &&
			today <= 5
		) {
			dayView.value =
				"dovr";
		} else if (
			today === 6
		) {
			dayView.value =
				"za";
		} else {
			dayView.value =
				"mawo";
		}

		renderStreetList();
		renderList();
	</script>

</body>
</html>
