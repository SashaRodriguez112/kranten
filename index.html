<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Krantenwijk</title>
	<style>
		body {
			background: #000;
			color: snow;
			font-family: Arial, sans-serif;
			margin: 20px;
		}

		h1 select {
	        background: #002222;
	        color: white;
	        border: 2px solid turquoise;
	        border-radius: 8px;
	        font-size: 22px;
	        padding: 4px 10px;
	        margin-left: 15px;
	        position: relative;     
        }

		h1, h2 {
			color: turquoise;
		}

		h1 {
			padding-bottom: 10px;
		}

		#dayView {
			position: relative;
			bottom: 3px;
		}

		.controls {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
			align-items: center;
			margin-bottom: 20px;
		}

		input, select, button {
			height: 40px;
			border: 2px solid turquoise;
			border-radius: 8px;
			background: #002222;
			color: white;
			padding: 0 10px;
			font-size: 16px;
		}

		button {
			cursor: pointer;
		}

		button:hover {
			background: #004444;
		}

		#referenceContainer {
			display: none;
		}

		ul {
			list-style: none;
			padding: 0;
		}

		li {
			width: max-content;
			min-width: 300px;
			height: 30px;
			padding: 8px 15px;
			border: 2px solid turquoise;
			background: #002222;
			border-radius: 10px;
			margin-bottom: 8px;
			display: flex;
			align-items: center;
			justify-content: space-between;
		}

		.houseLeft {
			display: flex;
			align-items: center;
			gap: 10px;
			user-select: none;
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
		}

		input[type="checkbox"] {
			width: 22px;
			height: 22px;
		}

		.deleteHouse {
			border-color: red;
			background: #220000;
			height: 35px;
		}

		.deleteHouse:hover {
			background: #550000;
		}

		#importPopup,
		#exportPopup,
		#statsPopup,
		#reorderPopup {
			display: none;
			position: fixed;
			inset: 0;
			background: rgba(0,0,0,0.7);
			align-items: center;
			justify-content: center;
			z-index: 1000;
		}

		.importBox {
			background: #002222;
			border: 2px solid turquoise;
			border-radius: 12px;
			padding: 20px;
			width: min(500px, 90%);
		}

		.importBox h2 {
			margin-top: 0;
		}

		#importText {
			width: 100%;
			height: 180px;
			resize: vertical;
			box-sizing: border-box;
			margin-bottom: 15px;
			background-color: #000000;
			color: snow; 
		}

		.importOptions {
			display: flex;
			gap: 10px;
			margin-bottom: 15px;
		}

		.importButtons {
			display: flex;
			gap: 10px;
		}

		summary.header {
			display: flex;
			align-items: center;
			gap: 20px;
			cursor: pointer;
		}

		summary.header h1 {
			margin: 0;
		}

		summary.header select {
			margin-left: 10px;
		}

		#importFile {
			margin-bottom: 15px;
		}

		.file-upload {
			display: flex;
			align-items: center;
			gap: 12px;
			margin-top: 10px;
			margin-bottom: 15px;
			padding: 10px;
			width: fit-content;
			border: 2px solid #20e0d0;
			border-radius: 10px;
		}
        
		.file-button {
			background: #000;
			color: #eee;
			border: 2px solid #20e0d0;
			padding: 8px 14px;
			border-radius: 8px;
			cursor: pointer;
			font-size: 16px;
		}

		.file-button:hover {
			background: #20e0d0;
			color: #000;
		}

		#fileName {
			color: #aaa;
			font-size: 16px;
		}

		.streetHeading {
			user-select: none;
			-webkit-user-select: none;
			cursor: default;
		}

		.reorderMode .streetHeading {
			cursor: grab;
			border: 2px dashed turquoise;
			border-radius: 8px;
			padding: 6px 10px;
			width: max-content;
		}

		.reorderMode .streetHeading:active {
			cursor: grabbing;
		}

		.reorderMode .streetHeading.dragging {
			opacity: 0.4;
		}

		.streetDropTarget {
			border-top: 3px solid turquoise;
		}

		#reorderHint {
			color: #aaa;
			margin-bottom: 15px;
		}
	</style>
</head>

<body>
	<div>
		<details>
			<summary class="header">
				<h1>Krantenwijk</h1>
				<select id="dayView">
					<option value="mawo">Ma-Wo</option>
					<option value="dovr">Do-Vr</option>
					<option value="za">Za</option>
					<option value="f">F</option>
				</select>
			</summary>

			<div class="controls">
				<select id="street"></select>
				<button id="addStreet">+ Street</button>
				<button id="removeStreet">- Street</button>
				<input type="number" id="houseNumber" placeholder="House number">
				<select id="krant">
					<option>VK</option>
					<option>HD</option>
					<option>NRC</option>
					<option>YC</option>
					<option>HFD</option>
					<option>TEL</option>
					<option>TR</option>
					<option>HP</option>
					<option>AD</option>
					<option>NYT</option>
					<option>F</option>
				</select>
				<select id="action">
					<option value="add">Add</option>
					<option value="bij">Bij</option>
					<option value="af">Af</option>
				</select>
				<select id="days">
					<option value="mawo">Ma-Wo</option>
					<option value="week">Ma-Za</option>
					<option value="dovr">Do-Vr</option>
					<option value="doza">Do-Za</option>
					<option value="za">Za</option>
					<option value="f">F</option>
				</select>
				<span id="referenceContainer">
					<select id="reference"></select>
				</span>
				<button id="submit">Submit</button>
				<button id="exportData">Export</button>
				<button id="importData">Import</button>
				<button id="statsButton">Stats</button>
				<button id="clearChecked">Clear Checked</button>
			</div>
		</details>

		<ul id="houseList"></ul>
	</div>

	<div id="importPopup">
		<div class="importBox">
			<h2>Import Route</h2>
			<textarea id="importText" placeholder="Paste exported route here"></textarea>

			<div class="file-upload">
				<input type="file" id="importFile" accept=".json" hidden>
				<label for="importFile" class="file-button">Choose route file</label>
				<span id="fileName">No file selected</span>
			</div>

			<div class="importOptions">
				<select id="importDays">
					<option value="all">All days</option>
					<option value="mawo">Ma-Wo</option>
					<option value="dovr">Do-Vr</option>
					<option value="za">Za</option>
					<option value="f">F</option>
				</select>

				<select id="importMode">
					<option value="replace">Replace</option>
					<option value="add">Add</option>
				</select>
			</div>

			<div class="importButtons">
				<button id="cancelImport">Cancel</button>
				<button id="confirmImport">Import</button>
			</div>
		</div>
	</div>

	<div id="exportPopup">
		<div class="importBox">
			<h2>Export Route</h2>
			<p>Choose how you want to export your route.</p>
			<br>

			<div class="importButtons">
				<button id="copyExport">📋 Copy to Clipboard</button>
				<button id="downloadExport">📄 Download JSON</button>
			</div>

			<br>

			<div class="importButtons">
				<button id="cancelExport">Cancel</button>
			</div>
		</div>
	</div>

	<div id="statsPopup">
		<div class="importBox">
			<h2>Route Statistics</h2>

			<select id="statsDay">
				<option value="mawo">Ma-Wo</option>
				<option value="dovr">Do-Vr</option>
				<option value="za">Za</option>
				<option value="f">F</option>
			</select>

			<br><br>

			<div id="statsContent"></div>

			<br>

			<div class="importButtons">
				<button id="closeStats">Close</button>
			</div>
		</div>
	</div>

	<div id="reorderPopup">
		<div class="importBox">
			<h2>Reorder Streets</h2>
			<p id="reorderHint">
				Drag the streets into the order you want for this day.
			</p>

			<div id="reorderList"></div>

			<br>

			<div class="importButtons">
				<button id="cancelReorder">Cancel</button>
				<button id="saveReorder">Save Order</button>
			</div>
		</div>
	</div>

	<br>
	<br>
	<br>
	<br>
	<br>

	<script>
		let streets = [];
		let houses = [];

		/*
			Each day gets its own street order.

			Example:
			mawo: [1, 2, 3]
			f:    [3, 2, 1]

			This means changing the F order does not affect Ma-Wo.
		*/
		let streetOrders = {
			mawo: [],
			dovr: [],
			za: [],
			f: []
		};

		const street = document.getElementById("street");
		const addStreet = document.getElementById("addStreet");
		const removeStreet = document.getElementById("removeStreet");
		const houseNumber = document.getElementById("houseNumber");
		const krant = document.getElementById("krant");
		const action = document.getElementById("action");
		const days = document.getElementById("days");
		const reference = document.getElementById("reference");
		const referenceContainer = document.getElementById("referenceContainer");
		const submit = document.getElementById("submit");
		const houseList = document.getElementById("houseList");
		const dayView = document.getElementById("dayView");
		const exportData = document.getElementById("exportData");
		const importData = document.getElementById("importData");
		const importPopup = document.getElementById("importPopup");
		const importText = document.getElementById("importText");
		const importDays = document.getElementById("importDays");
		const importMode = document.getElementById("importMode");
		const confirmImport = document.getElementById("confirmImport");
		const cancelImport = document.getElementById("cancelImport");
		const exportPopup = document.getElementById("exportPopup");
		const copyExport = document.getElementById("copyExport");
		const downloadExport = document.getElementById("downloadExport");
		const cancelExport = document.getElementById("cancelExport");
		const importFile = document.getElementById("importFile");
		const clearChecked = document.getElementById("clearChecked");
		const statsButton = document.getElementById("statsButton");
		const statsPopup = document.getElementById("statsPopup");
		const statsDay = document.getElementById("statsDay");
		const statsContent = document.getElementById("statsContent");
		const closeStats = document.getElementById("closeStats");

		const reorderPopup = document.getElementById("reorderPopup");
		const reorderList = document.getElementById("reorderList");
		const cancelReorder = document.getElementById("cancelReorder");
		const saveReorder = document.getElementById("saveReorder");

		let reorderDay = null;
		let reorderTemp = [];
		let longPressTimer = null;
		let longPressTriggered = false;

		function saveData() {
			localStorage.setItem("streets", JSON.stringify(streets));
			localStorage.setItem("houses", JSON.stringify(houses));
			localStorage.setItem("streetOrders", JSON.stringify(streetOrders));
		}

		function normalizeStreetOrders() {
			const validDays = ["mawo", "dovr", "za", "f"];

			validDays.forEach(day => {
				if (!Array.isArray(streetOrders[day])) {
					streetOrders[day] = [];
				}

				/*
					Remove streets that no longer exist.
				*/
				streetOrders[day] = streetOrders[day].filter(name =>
					streets.includes(name)
				);

				/*
					Add any existing streets that don't have an order yet.
				*/
				streets.forEach(name => {
					if (!streetOrders[day].includes(name)) {
						streetOrders[day].push(name);
					}
				});
			});
		}

		function loadData() {
			const savedStreets = localStorage.getItem("streets");
			const savedHouses = localStorage.getItem("houses");
			const savedStreetOrders = localStorage.getItem("streetOrders");

			if (savedStreets) {
				streets = JSON.parse(savedStreets);
			}

			if (savedHouses) {
				houses = JSON.parse(savedHouses);

				houses.forEach(house => {
					if (Array.isArray(house.kranten)) {
						house.kranten = {
							mawo: house.kranten,
							dovr: [],
							za: [],
							f: []
						};
					}

					if (!house.kranten || typeof house.kranten !== "object") {
						house.kranten = {
							mawo: [],
							dovr: [],
							za: [],
							f: []
						};
					}

					house.kranten.mawo ??= [];
					house.kranten.dovr ??= [];
					house.kranten.za ??= [];
					house.kranten.f ??= [];

					if (typeof house.checked === "boolean") {
						house.checked = {
							mawo: house.checked,
							dovr: false,
							za: false,
							f: false
						};
					}

					if (!house.checked || typeof house.checked !== "object") {
						house.checked = {
							mawo: false,
							dovr: false,
							za: false,
							f: false
						};
					}

					house.checked.mawo ??= false;
					house.checked.dovr ??= false;
					house.checked.za ??= false;
					house.checked.f ??= false;
				});
			}

			if (savedStreetOrders) {
				try {
					streetOrders = JSON.parse(savedStreetOrders);
				} catch {
					streetOrders = {
						mawo: [],
						dovr: [],
						za: [],
						f: []
					};
				}
			}

			normalizeStreetOrders();

			/*
				If this is an older version without streetOrders,
				use the original street order as the starting order.
			*/
			saveData();
		}

		function getOrderedStreets(day) {
			normalizeStreetOrders();

			return streetOrders[day].filter(streetName => {
				return houses.some(house =>
					house.street === streetName &&
					house.kranten[day] &&
					house.kranten[day].length > 0
				);
			});
		}

		function addStreetToDayOrder(day, streetName) {
			if (!streetOrders[day].includes(streetName)) {
				streetOrders[day].push(streetName);
			}
		}

		function addStreetToAllDayOrders(streetName) {
			["mawo", "dovr", "za", "f"].forEach(day => {
				addStreetToDayOrder(day, streetName);
			});
		}

		dayView.addEventListener("change", () => {
			renderList();
		});

		function updateStats() {
			const day = statsDay.value;

			const counts = {
				VK: 0,
				HD: 0,
				NRC: 0,
				YC: 0,
				HFD: 0,
				TEL: 0,
				TR: 0,
				HP: 0,
				AD: 0,
				NYT: 0,
				F: 0
			};

			let total = 0;
			let houseCount = 0;

			houses.forEach(house => {
				if (house.kranten[day].length > 0) {
					houseCount++;
				}

				house.kranten[day].forEach(paper => {
					counts[paper]++;
					total++;
				});
			});

			let html = "";

			const sorted = Object.entries(counts)
				.sort((a, b) => b[1] - a[1]);

			html += `<div style="font-size:17px;">`;

			sorted
				.filter(([, amount]) => amount > 0)
				.forEach(([paper, amount]) => {
					html += `
                        <div style="
                            display:flex;
                            justify-content:space-between;
                            align-items:center;
                            padding:6px 0;
                            border-bottom:1px solid rgba(64,224,208,.2);
                        ">
                            <span>${paper}</span>
                            <strong>${amount}</strong>
                        </div>
                    `;
				});

			html += `
                </div>

                <hr style="border-color:turquoise; margin:16px 0;">

                <div style="display:flex;justify-content:space-between;padding:4px 0;">
                    <span>Total papers</span>
                    <strong>${total}</strong>
                </div>

                <div style="display:flex;justify-content:space-between;padding:4px 0;">
                    <span>Houses</span>
                    <strong>${houseCount}</strong>
                </div>

                <div style="display:flex;justify-content:space-between;padding:4px 0;">
                    <span>Average / house</span>
                    <strong>${houseCount ? (total / houseCount).toFixed(2) : "0.00"}</strong>
                </div>
            `;

			statsContent.innerHTML = html;
		}

		function renderStreetList() {
			street.innerHTML = "";

			if (streets.length === 0) {
				let option = document.createElement("option");
				option.textContent = "Add street first";
				option.value = "";
				street.appendChild(option);
				return;
			}

			streets.forEach(name => {
				let option = document.createElement("option");
				option.value = name;
				option.textContent = name;
				street.appendChild(option);
			});
		}

		function renderReferenceList() {
			reference.innerHTML = "";

			houses.filter(h => h.street === street.value).forEach((house) => {
				let option = document.createElement("option");

				const krantenText = [...new Set(Object.values(house.kranten).flat())];

				option.value = houses.indexOf(house);
				option.textContent = `${house.number} ${krantenText.join("/")}`;

				reference.appendChild(option);
			});
		}

		async function copyRoute() {
			const exportObject = {
				version: 2,
				streets,
				houses,
				streetOrders
			};

			const text = JSON.stringify(exportObject);

			try {
				await navigator.clipboard.writeText(text);
				alert("Route copied!");
				exportPopup.style.display = "none";
			} catch {
				alert("Couldn't copy to the clipboard.");
			}
		}

		copyExport.addEventListener("click", () => {
			copyRoute();
		});

		statsButton.addEventListener("click", () => {
			statsDay.value = dayView.value;
			updateStats();
			statsPopup.style.display = "flex";
		});

		statsDay.addEventListener("change", updateStats);

		closeStats.addEventListener("click", () => {
			statsPopup.style.display = "none";
		});

		clearChecked.addEventListener("click", () => {
			const selectedDay = dayView.value;

			const anyChecked = houses.some(h => h.checked[selectedDay]);

			if (!anyChecked) {
				alert("Nothing is checked.");
				return;
			}

			if (!confirm(`Clear all checked houses for ${selectedDay}?`)) {
				return;
			}

			houses.forEach(house => {
				house.checked[selectedDay] = false;
			});

			saveData();
			renderList();
		});

		function downloadRoute() {
			const exportObject = {
				version: 2,
				streets,
				houses,
				streetOrders
			};

			const text = JSON.stringify(exportObject, null, 2);

			const blob = new Blob([text], {
				type: "application/json"
			});

			const url = URL.createObjectURL(blob);

			const a = document.createElement("a");
			a.href = url;
			a.download = "krantenwijk-backup.json";

			document.body.appendChild(a);
			a.click();
			a.remove();

			URL.revokeObjectURL(url);

			exportPopup.style.display = "none";
		}

		function startLongPress(streetName) {
			longPressTriggered = false;

			longPressTimer = setTimeout(() => {
				longPressTriggered = true;
				openReorderMode(streetName);
			}, 3000);
		}

		function cancelLongPress() {
			if (longPressTimer) {
				clearTimeout(longPressTimer);
				longPressTimer = null;
			}
		}

		function openReorderMode(streetName) {
			reorderDay = dayView.value;

			normalizeStreetOrders();

			/*
				Start with the current order for this day.
			*/
			reorderTemp = [...streetOrders[reorderDay]];

			reorderPopup.style.display = "flex";

			renderReorderList();

			/*
				The street that was long-pressed is selected/highlighted
				by being scrolled into view.
			*/
			setTimeout(() => {
				const item = reorderList.querySelector(
					`[data-street="${CSS.escape(streetName)}"]`
				);

				if (item) {
					item.scrollIntoView({
						behavior: "smooth",
						block: "center"
					});
				}
			}, 50);
		}

		function renderReorderList() {
			reorderList.innerHTML = "";

			reorderTemp.forEach((streetName, index) => {
				const item = document.createElement("div");

				item.textContent = `${index + 1}. ${streetName}`;
				item.dataset.street = streetName;
				item.draggable = true;

				item.style.cssText = `
					padding: 12px;
					margin-bottom: 8px;
					border: 2px solid turquoise;
					border-radius: 8px;
					background: #000;
					cursor: grab;
					user-select: none;
				`;

				item.addEventListener("dragstart", event => {
					item.style.opacity = "0.4";
					event.dataTransfer.setData("text/plain", streetName);
				});

				item.addEventListener("dragend", () => {
					item.style.opacity = "1";
				});

				item.addEventListener("dragover", event => {
					event.preventDefault();
					item.classList.add("streetDropTarget");
				});

				item.addEventListener("dragleave", () => {
					item.classList.remove("streetDropTarget");
				});

				item.addEventListener("drop", event => {
					event.preventDefault();

					item.classList.remove("streetDropTarget");

					const draggedStreet = event.dataTransfer.getData("text/plain");

					if (!draggedStreet || draggedStreet === streetName) {
						return;
					}

					const fromIndex = reorderTemp.indexOf(draggedStreet);
					const toIndex = reorderTemp.indexOf(streetName);

					if (fromIndex === -1 || toIndex === -1) {
						return;
					}

					reorderTemp.splice(fromIndex, 1);
					reorderTemp.splice(toIndex, 0, draggedStreet);

					renderReorderList();
				});

				reorderList.appendChild(item);
			});
		}

		cancelReorder.addEventListener("click", () => {
			reorderPopup.style.display = "none";
			reorderDay = null;
			reorderTemp = [];
		});

		saveReorder.addEventListener("click", () => {
			if (!reorderDay) return;

			streetOrders[reorderDay] = [...reorderTemp];

			saveData();
			renderList();

			reorderPopup.style.display = "none";
			reorderDay = null;
			reorderTemp = [];
		});

		function renderList() {
			houseList.innerHTML = "";

			let idCounter = 0;
			const selectedDay = dayView.value;

			normalizeStreetOrders();

			const orderedStreets = getOrderedStreets(selectedDay);

			orderedStreets.forEach(streetName => {

				const visibleHouses = houses.filter(h =>
					h.street === streetName &&
					h.kranten[selectedDay].length > 0
				);

				if (visibleHouses.length === 0) {
					return;
				}

				let heading = document.createElement("h2");
				heading.textContent = streetName;
				heading.className = "streetHeading";

				/*
					Long press for 3 seconds on a street.
					Works with mouse and touch.
				*/
				heading.addEventListener("mousedown", () => {
					startLongPress(streetName);
				});

				heading.addEventListener("mouseup", cancelLongPress);
				heading.addEventListener("mouseleave", cancelLongPress);

				heading.addEventListener("touchstart", event => {
					event.preventDefault();
					startLongPress(streetName);
				}, { passive: false });

				heading.addEventListener("touchend", cancelLongPress);
				heading.addEventListener("touchcancel", cancelLongPress);

				houseList.appendChild(heading);

				visibleHouses.forEach(house => {

					let li = document.createElement("li");

					let uniqueId =
						`chk-${streetName.replace(/\s/g, '-')}-${house.number}-${idCounter++}`;

					li.innerHTML = `
                        <div class="houseLeft">
                            <input type="checkbox" id="${uniqueId}">
                            <label for="${uniqueId}">
                                <strong>${house.number} ${house.kranten[selectedDay].join("/")}</strong>
                            </label>
                        </div>
                        <button class="deleteHouse">x</button>
                    `;

					let checkbox = li.querySelector("input");

					if (typeof house.checked === "boolean") {
						house.checked = {
							mawo: house.checked,
							dovr: false,
							za: false,
							f: false
						};
					}

					house.checked.mawo ??= false;
					house.checked.dovr ??= false;
					house.checked.za ??= false;
					house.checked.f ??= false;

					checkbox.checked = house.checked[selectedDay];

					checkbox.addEventListener("change", () => {
						house.checked[selectedDay] = checkbox.checked;
						saveData();
					});

					li.querySelector(".deleteHouse").addEventListener("click", () => {
						const confirmed = confirm(
							`Delete house ${house.number} (${house.kranten[selectedDay].join("/")})?`
						);

						if (!confirmed) return;

						houses.splice(houses.indexOf(house), 1);

						saveData();
						renderList();
					});

					houseList.appendChild(li);
				});
			});

			renderReferenceList();
		}

		importFile.addEventListener("change", function() {
			const fileName = this.files[0]?.name || "No file selected";
			document.getElementById("fileName").textContent = fileName;
		});

		action.addEventListener("change", () => {
			referenceContainer.style.display =
				action.value === "bij" ? "inline" : "none";

			renderReferenceList();
		});

		addStreet.addEventListener("click", () => {
			const name = prompt("Street name:");

			if (!name) return;

			if (streets.includes(name)) {
				alert("Street already exists.");
				return;
			}

			streets.push(name);

			/*
				New streets start at the end for every day.
				They can then be reordered separately per day.
			*/
			addStreetToAllDayOrders(name);

			saveData();
			renderStreetList();

			street.value = name;

			renderList();
		});

		importFile.addEventListener("change", () => {
			const file = importFile.files[0];

			if (!file) return;

			const reader = new FileReader();

			reader.onload = () => {
				importText.value = reader.result;
			};

			reader.readAsText(file);
		});

		downloadExport.addEventListener("click", () => {
			downloadRoute();
		});

		removeStreet.addEventListener("click", () => {
			if (!street.value) return;

			const name = street.value;
			const amount = houses.filter(h => h.street === name).length;

			if (amount > 0) {
				const confirmDelete =
					confirm("This street still has houses. Delete everything?");

				if (!confirmDelete) return;

				houses = houses.filter(h => h.street !== name);
			} else {
				const confirmDelete = confirm("Delete street?");

				if (!confirmDelete) return;

				houses = houses.filter(h => h.street !== name);
			}

			streets.splice(streets.indexOf(name), 1);

			/*
				Remove the street from every day's order too.
			*/
			["mawo", "dovr", "za", "f"].forEach(day => {
				streetOrders[day] =
					streetOrders[day].filter(streetName => streetName !== name);
			});

			saveData();
			renderStreetList();
			renderList();
		});

		street.addEventListener("change", () => {
			renderReferenceList();
		});

		function getSelectedDayGroups() {
			switch (days.value) {
				case "mawo":
					return ["mawo"];

				case "week":
					return ["mawo", "dovr", "za"];

				case "dovr":
					return ["dovr"];

				case "doza":
					return ["dovr", "za"];

				case "za":
					return ["za"];

				case "f":
					return ["f"];

				default:
					return [];
			}
		}

		function importRoute(data, mode, day) {

			if (!data.streets || !data.houses) {
				alert("Invalid route data.");
				return;
			}

			const daysToImport = day === "all"
				? ["mawo", "dovr", "za", "f"]
				: [day];

			if (mode === "replace") {

				if (day === "all") {
					streets = [];
					houses = [];

					streetOrders = {
						mawo: [],
						dovr: [],
						za: [],
						f: []
					};

				} else {

					houses.forEach(house => {
						house.kranten ??= {
							mawo: [],
							dovr: [],
							za: [],
							f: []
						};

						house.checked ??= {
							mawo: false,
							dovr: false,
							za: false,
							f: false
						};

						daysToImport.forEach(d => {
							house.kranten[d] = [];
							house.checked[d] = false;
						});
					});

					houses = houses.filter(house =>
						house.kranten.mawo.length ||
						house.kranten.dovr.length ||
						house.kranten.za.length ||
						house.kranten.f.length
					);

					/*
						When replacing one day, its street order is also
						replaced by the order in the imported file.
					*/
					streetOrders[day] = [];
				}
			}

			data.streets.forEach(name => {
				if (!streets.includes(name)) {
					streets.push(name);
				}
			});

			/*
				Import the saved street order when available.
				Older exports simply fall back to the order of data.streets.
			*/
			if (data.streetOrders && typeof data.streetOrders === "object") {

				daysToImport.forEach(d => {
					if (Array.isArray(data.streetOrders[d])) {

						if (mode === "replace") {
							streetOrders[d] = data.streetOrders[d].filter(name =>
								streets.includes(name)
							);
						} else {
							data.streetOrders[d].forEach(name => {
								if (
									streets.includes(name) &&
									!streetOrders[d].includes(name)
								) {
									streetOrders[d].push(name);
								}
							});
						}
					}
				});

			} else {

				daysToImport.forEach(d => {
					data.streets.forEach(name => {
						if (!streetOrders[d].includes(name)) {
							streetOrders[d].push(name);
						}
					});
				});
			}

			data.houses.forEach(importedHouse => {

				let existing = houses.find(h =>
					h.street === importedHouse.street &&
					h.number == importedHouse.number
				);

				if (!existing) {

					existing = {
						street: importedHouse.street,
						number: importedHouse.number,
						checked: {
							mawo: false,
							dovr: false,
							za: false,
							f: false
						},
						kranten: {
							mawo: [],
							dovr: [],
							za: [],
							f: []
						}
					};

					houses.push(existing);
				}

				existing.kranten ??= {
					mawo: [],
					dovr: [],
					za: [],
					f: []
				};

				existing.checked ??= {
					mawo: false,
					dovr: false,
					za: false,
					f: false
				};

				daysToImport.forEach(d => {

					const importedKranten =
						importedHouse.kranten &&
						Array.isArray(importedHouse.kranten[d])
							? importedHouse.kranten[d]
							: [];

					importedKranten.forEach(krant => {

						if (!existing.kranten[d].includes(krant)) {
							existing.kranten[d].push(krant);
						}

					});

					existing.kranten[d].sort();

				});

			});

			normalizeStreetOrders();

			saveData();
			renderStreetList();
			renderList();

			alert("Import complete.");
		}

		submit.addEventListener("click", () => {
			if (!street.value) {
				alert("Add a street first.");
				return;
			}

			const number = houseNumber.value.trim();

			if (number === "") {
				alert("Enter a house number.");
				return;
			}

			const selectedKrant = krant.value;
			const selectedDays = getSelectedDayGroups();

			if (action.value === "add") {

				let existing = houses.find(
					h => h.street === street.value && h.number == number
				);

				if (existing) {

					selectedDays.forEach(day => {
						if (!existing.kranten[day].includes(selectedKrant)) {
							existing.kranten[day].push(selectedKrant);
							existing.kranten[day].sort();
						}
					});

				} else {

					let newHouse = {
						street: street.value,
						number: number,
						checked: {
							mawo: false,
							dovr: false,
							za: false,
							f: false
						},
						kranten: {
							mawo: [],
							dovr: [],
							za: [],
							f: []
						}
					};

					selectedDays.forEach(day => {
						newHouse.kranten[day].push(selectedKrant);
					});

					houses.push(newHouse);
				}

				/*
					If a street receives its first house for a day,
					put it at the END of that day's street order.

					Example:
					F starts as 1,2,3.
					If you remove F houses from 2 and 1 and later
					add something to 2 again, its position can still
					be manually changed with the 3-second reorder.
				*/
				selectedDays.forEach(day => {
					addStreetToDayOrder(day, street.value);
				});

			} else if (action.value === "bij") {

				let existing = houses.find(
					h => h.street === street.value && h.number == number
				);

				if (existing) {

					selectedDays.forEach(day => {
						if (!existing.kranten[day].includes(selectedKrant)) {
							existing.kranten[day].push(selectedKrant);
							existing.kranten[day].sort();
						}
					});

				} else {

					let newHouse = {
						street: street.value,
						number: number,
						checked: {
							mawo: false,
							dovr: false,
							za: false,
							f: false
						},
						kranten: {
							mawo: [],
							dovr: [],
							za: [],
							f: []
						}
					};

					selectedDays.forEach(day => {
						newHouse.kranten[day].push(selectedKrant);
					});

					let referenceHouse = parseInt(reference.value);

					if (isNaN(referenceHouse)) {
						houses.push(newHouse);
					} else {
						houses.splice(referenceHouse, 0, newHouse);
					}

				}

				/*
					Bij does NOT alter the street order.
					The street order belongs to each day, not to
					the order in the global houses array.
				*/
				selectedDays.forEach(day => {
					addStreetToDayOrder(day, street.value);
				});

			} else if (action.value === "af") {

				let existing = houses.find(
					h => h.street === street.value && h.number == number
				);

				if (!existing) {
					alert("House not found.");
					return;
				}

				selectedDays.forEach(day => {
					let index = existing.kranten[day].indexOf(selectedKrant);

					if (index !== -1) {
						existing.kranten[day].splice(index, 1);
					}
				});

				const hasAnyKranten =
					existing.kranten.mawo.length ||
					existing.kranten.dovr.length ||
					existing.kranten.za.length ||
					existing.kranten.f.length;

				if (!hasAnyKranten) {
					houses.splice(houses.indexOf(existing), 1);
				}
			}

			saveData();
			renderList();

			houseNumber.value = "";
			houseNumber.focus();
		});

		exportData.addEventListener("click", () => {
			exportPopup.style.display = "flex";
		});

		cancelImport.addEventListener("click", () => {
			importPopup.style.display = "none";
			importText.value = "";
		});

		cancelExport.addEventListener("click", () => {
			exportPopup.style.display = "none";
		});

		confirmImport.addEventListener("click", () => {

			let data;

			try {
				data = JSON.parse(importText.value);
			} catch {
				alert("Invalid route data.");
				return;
			}

			importRoute(
				data,
				importMode.value,
				importDays.value
			);

			importPopup.style.display = "none";
			importText.value = "";
		});

		importData.addEventListener("click", () => {
			importPopup.style.display = "flex";
		});

		loadData();

		const today = new Date().getDay();

		if (today >= 1 && today <= 3) {
			dayView.value = "mawo";
		} else if (today >= 4 && today <= 5) {
			dayView.value = "dovr";
		} else if (today === 6) {
			dayView.value = "za";
		} else {
			dayView.value = "mawo";
		}

		renderStreetList();
		renderList();
	</script>
</body>
</html>
