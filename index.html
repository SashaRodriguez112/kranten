<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#000000">
	<title>Krantenwijk</title>

	<style>
		* {
			box-sizing: border-box;
		}

		body {
			background: #000;
			color: snow;
			font-family: Arial, sans-serif;
			margin: 20px;
			-webkit-tap-highlight-color: transparent;
		}

		h1, h2 {
			color: turquoise;
		}

		h1 {
			margin: 0;
			padding-bottom: 10px;
			font-size: 28px;
		}

		h1 select {
			background: #002222;
			color: white;
			border: 2px solid turquoise;
			border-radius: 8px;
			font-size: 20px;
			padding: 4px 8px;
			margin-left: 10px;
		}

		#dayView {
			position: relative;
			bottom: 3px;
		}

		.controls {
			display: flex;
			gap: 8px;
			flex-wrap: wrap;
			align-items: center;
			margin-bottom: 20px;
		}

		input, select, button {
			min-height: 40px;
			border: 2px solid turquoise;
			border-radius: 8px;
			background: #002222;
			color: white;
			padding: 0 9px;
			font-size: 16px;
			max-width: 100%;
		}

		button {
			cursor: pointer;
			touch-action: manipulation;
		}

		button:hover {
			background: #004444;
		}

		#referenceContainer {
			display: none;
		}

		ul {
			list-style: none;
			padding: 0;
			margin-top: 10px;
		}

		li {
			width: min(100%, 360px);
			min-height: 46px;
			padding: 7px 10px;
			border: 2px solid turquoise;
			background: #002222;
			border-radius: 10px;
			margin-bottom: 7px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
		}

		.houseLeft {
			display: flex;
			align-items: center;
			gap: 8px;
			user-select: none;
			-webkit-user-select: none;
			min-width: 0;
		}

		.houseLeft label {
			overflow-wrap: anywhere;
		}

		input[type="checkbox"] {
			width: 21px;
			height: 21px;
			flex-shrink: 0;
		}

		.deleteHouse {
			border-color: red;
			background: #220000;
			height: 34px;
			min-height: 34px;
			padding: 0 10px;
			flex-shrink: 0;
		}

		.deleteHouse:hover {
			background: #550000;
		}

		.streetHeading {
			user-select: none;
			-webkit-user-select: none;
			cursor: default;
			margin: 20px 0 8px;
			font-size: 22px;
			touch-action: manipulation;
		}

		.streetHint {
			color: #777;
			font-size: 13px;
			margin: -4px 0 8px;
		}

		#importPopup,
		#exportPopup,
		#statsPopup,
		#reorderPopup {
			display: none;
			position: fixed;
			inset: 0;
			background: rgba(0,0,0,0.75);
			align-items: center;
			justify-content: center;
			z-index: 1000;
			padding: 15px;
		}

		.importBox {
			background: #002222;
			border: 2px solid turquoise;
			border-radius: 12px;
			padding: 18px;
			width: min(500px, 100%);
			max-height: 90vh;
			overflow-y: auto;
		}

		.importBox h2 {
			margin-top: 0;
		}

		#importText {
			width: 100%;
			height: 160px;
			resize: vertical;
			box-sizing: border-box;
			margin-bottom: 12px;
			background: #000;
			color: snow;
			padding: 10px;
		}

		.importOptions,
		.importButtons {
			display: flex;
			gap: 8px;
			flex-wrap: wrap;
		}

		summary.header {
			display: flex;
			align-items: center;
			gap: 10px;
			cursor: pointer;
			list-style: none;
		}

		summary.header::-webkit-details-marker {
			display: none;
		}

		summary.header h1 {
			margin: 0;
		}

		#importFile {
			margin-bottom: 12px;
		}

		.file-upload {
			display: flex;
			align-items: center;
			gap: 10px;
			flex-wrap: wrap;
			margin: 10px 0 12px;
			padding: 9px;
			width: fit-content;
			max-width: 100%;
			border: 2px solid #20e0d0;
			border-radius: 10px;
		}

		.file-button {
			background: #000;
			color: #eee;
			border: 2px solid #20e0d0;
			padding: 7px 12px;
			border-radius: 8px;
			cursor: pointer;
			font-size: 15px;
		}

		.file-button:hover {
			background: #20e0d0;
			color: #000;
		}

		#fileName {
			color: #aaa;
			font-size: 14px;
			overflow-wrap: anywhere;
		}

		#reorderHint {
			color: #aaa;
			margin-bottom: 15px;
		}

		.reorderItem {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-bottom: 8px;
		}

		.reorderName {
			flex: 1;
			padding: 11px;
			border: 2px solid turquoise;
			border-radius: 8px;
			background: #000;
			cursor: grab;
			user-select: none;
		}

		.reorderItem.dragging {
			opacity: .4;
		}

		.reorderMove {
			min-width: 42px;
			padding: 0;
		}

		.streetDropTarget {
			border-top: 3px solid turquoise;
		}

		@media (max-width: 600px) {
			body {
				margin: 10px;
			}

			h1 {
				font-size: 22px;
			}

			h1 select {
				font-size: 16px;
				margin-left: 5px;
				padding: 3px 6px;
			}

			summary.header {
				gap: 5px;
			}

			.controls {
				gap: 6px;
				margin-bottom: 14px;
			}

			input, select, button {
				min-height: 36px;
				font-size: 14px;
				padding: 0 7px;
			}

			li {
				width: 100%;
				min-height: 42px;
				padding: 6px 8px;
			}

			.streetHeading {
				font-size: 19px;
				margin-top: 16px;
			}

			.importBox {
				padding: 14px;
			}
		}

		@media (max-width: 420px) {
			.controls > * {
				flex: 1 1 auto;
			}

			.controls #referenceContainer {
				flex: 1 1 auto;
			}

			#houseNumber {
				min-width: 0;
			}

			.importButtons button,
			.importOptions select {
				flex: 1;
			}
		}
	</style>
</head>

<body>

	<div>
		<details>
			<summary class="header">
				<h1>Krantenwijk</h1>
				<select id="dayView">
					<option value="mawo">Ma-Wo</option>
					<option value="dovr">Do-Vr</option>
					<option value="za">Za</option>
					<option value="f">F</option>
				</select>
			</summary>

			<div class="controls">
				<select id="street"></select>
				<button id="addStreet">+ Street</button>
				<button id="removeStreet">- Street</button>

				<input type="number" id="houseNumber" placeholder="House number">

				<select id="krant">
					<option>VK</option>
					<option>HD</option>
					<option>NRC</option>
					<option>YC</option>
					<option>HFD</option>
					<option>TEL</option>
					<option>TR</option>
					<option>HP</option>
					<option>AD</option>
					<option>NYT</option>
					<option>F</option>
				</select>

				<select id="action">
					<option value="add">Add</option>
					<option value="bij">Bij</option>
					<option value="af">Af</option>
				</select>

				<select id="days">
					<option value="mawo">Ma-Wo</option>
					<option value="week">Ma-Za</option>
					<option value="dovr">Do-Vr</option>
					<option value="doza">Do-Za</option>
					<option value="za">Za</option>
					<option value="f">F</option>
				</select>

				<span id="referenceContainer">
					<select id="reference"></select>
				</span>

				<button id="submit">Submit</button>
				<button id="exportData">Export</button>
				<button id="importData">Import</button>
				<button id="statsButton">Stats</button>
				<button id="clearChecked">Clear Checked</button>
			</div>
		</details>

		<ul id="houseList"></ul>
	</div>

	<div id="importPopup">
		<div class="importBox">
			<h2>Import Route</h2>

			<textarea id="importText" placeholder="Paste exported route here"></textarea>

			<div class="file-upload">
				<input type="file" id="importFile" accept=".json" hidden>
				<label for="importFile" class="file-button">Choose route file</label>
				<span id="fileName">No file selected</span>
			</div>

			<div class="importOptions">
				<select id="importDays">
					<option value="all">All days</option>
					<option value="mawo">Ma-Wo</option>
					<option value="dovr">Do-Vr</option>
					<option value="za">Za</option>
					<option value="f">F</option>
				</select>

				<select id="importMode">
					<option value="replace">Replace</option>
					<option value="add">Add</option>
				</select>
			</div>

			<br>

			<div class="importButtons">
				<button id="cancelImport">Cancel</button>
				<button id="confirmImport">Import</button>
			</div>
		</div>
	</div>

	<div id="exportPopup">
		<div class="importBox">
			<h2>Export Route</h2>
			<p>Choose how you want to export your route.</p>

			<div class="importButtons">
				<button id="copyExport">Copy to Clipboard</button>
				<button id="downloadExport">Download JSON</button>
			</div>

			<br>

			<div class="importButtons">
				<button id="cancelExport">Cancel</button>
			</div>
		</div>
	</div>

	<div id="statsPopup">
		<div class="importBox">
			<h2>Route Statistics</h2>

			<select id="statsDay">
				<option value="mawo">Ma-Wo</option>
				<option value="dovr">Do-Vr</option>
				<option value="za">Za</option>
				<option value="f">F</option>
			</select>

			<br><br>

			<div id="statsContent"></div>

			<br>

			<div class="importButtons">
				<button id="closeStats">Close</button>
			</div>
		</div>
	</div>

	<div id="reorderPopup">
		<div class="importBox">
			<h2>Reorder Streets</h2>

			<p id="reorderHint">
				Reorder streets for this day only.
			</p>

			<div id="reorderList"></div>

			<br>

			<div class="importButtons">
				<button id="cancelReorder">Cancel</button>
				<button id="saveReorder">Save Order</button>
			</div>
		</div>
	</div>

	<script>
		let streets = [];
		let houses = [];

		const DAYS = ["mawo", "dovr", "za", "f"];

		/*
			Each day has its own street order.

			Example:
			mawo: [Street 1, Street 2, Street 3]
			f:    [Street 3, Street 2, Street 1]
		*/
		let streetOrders = {
			mawo: [],
			dovr: [],
			za: [],
			f: []
		};

		const street = document.getElementById("street");
		const addStreet = document.getElementById("addStreet");
		const removeStreet = document.getElementById("removeStreet");
		const houseNumber = document.getElementById("houseNumber");
		const krant = document.getElementById("krant");
		const action = document.getElementById("action");
		const days = document.getElementById("days");
		const reference = document.getElementById("reference");
		const referenceContainer = document.getElementById("referenceContainer");
		const submit = document.getElementById("submit");
		const houseList = document.getElementById("houseList");
		const dayView = document.getElementById("dayView");

		const exportData = document.getElementById("exportData");
		const importData = document.getElementById("importData");
		const importPopup = document.getElementById("importPopup");
		const importText = document.getElementById("importText");
		const importDays = document.getElementById("importDays");
		const importMode = document.getElementById("importMode");
		const confirmImport = document.getElementById("confirmImport");
		const cancelImport = document.getElementById("cancelImport");
		const exportPopup = document.getElementById("exportPopup");
		const copyExport = document.getElementById("copyExport");
		const downloadExport = document.getElementById("downloadExport");
		const cancelExport = document.getElementById("cancelExport");
		const importFile = document.getElementById("importFile");

		const clearChecked = document.getElementById("clearChecked");
		const statsButton = document.getElementById("statsButton");
		const statsPopup = document.getElementById("statsPopup");
		const statsDay = document.getElementById("statsDay");
		const statsContent = document.getElementById("statsContent");
		const closeStats = document.getElementById("closeStats");

		const reorderPopup = document.getElementById("reorderPopup");
		const reorderList = document.getElementById("reorderList");
		const cancelReorder = document.getElementById("cancelReorder");
		const saveReorder = document.getElementById("saveReorder");

		let reorderDay = null;
		let reorderTemp = [];
		let longPressTimer = null;

		function emptyStreetOrders() {
			return {
				mawo: [],
				dovr: [],
				za: [],
				f: []
			};
		}

		function saveData() {
			localStorage.setItem("streets", JSON.stringify(streets));
			localStorage.setItem("houses", JSON.stringify(houses));
			localStorage.setItem("streetOrders", JSON.stringify(streetOrders));
		}

		function ensureHouseStructure(house) {
			if (Array.isArray(house.kranten)) {
				house.kranten = {
					mawo: house.kranten,
					dovr: [],
					za: [],
					f: []
				};
			}

			if (!house.kranten || typeof house.kranten !== "object") {
				house.kranten = {
					mawo: [],
					dovr: [],
					za: [],
					f: []
				};
			}

			DAYS.forEach(day => {
				if (!Array.isArray(house.kranten[day])) {
					house.kranten[day] = [];
				}
			});

			if (typeof house.checked === "boolean") {
				house.checked = {
					mawo: house.checked,
					dovr: false,
					za: false,
					f: false
				};
			}

			if (!house.checked || typeof house.checked !== "object") {
				house.checked = {
					mawo: false,
					dovr: false,
					za: false,
					f: false
				};
			}

			DAYS.forEach(day => {
				if (typeof house.checked[day] !== "boolean") {
					house.checked[day] = false;
				}
			});
		}

		function streetIsUsedOnDay(streetName, day) {
			return houses.some(house =>
				house.street === streetName &&
				Array.isArray(house.kranten[day]) &&
				house.kranten[day].length > 0
			);
		}

		function buildOrderFromHouseUsage(day) {
			const result = [];

			houses.forEach(house => {
				if (
					!result.includes(house.street) &&
					streetIsUsedOnDay(house.street, day)
				) {
					result.push(house.street);
				}
			});

			return result;
		}

		function normalizeStreetOrders() {
			DAYS.forEach(day => {
				if (!Array.isArray(streetOrders[day])) {
					streetOrders[day] = [];
				}

				const used = new Set(
					houses
						.filter(h => streetIsUsedOnDay(h.street, day))
						.map(h => h.street)
				);

				/*
					Only keep streets that actually have newspapers
					on this day.
				*/
				streetOrders[day] = streetOrders[day].filter(name =>
					streets.includes(name) && used.has(name)
				);

				/*
					Add used streets that aren't in the saved order yet.
					The order follows the first occurrence in houses.
				*/
				buildOrderFromHouseUsage(day).forEach(name => {
					if (!streetOrders[day].includes(name)) {
						streetOrders[day].push(name);
					}
				});
			});
		}

		function loadData() {
			const savedStreets = localStorage.getItem("streets");
			const savedHouses = localStorage.getItem("houses");
			const savedStreetOrders = localStorage.getItem("streetOrders");

			if (savedStreets) {
				try {
					streets = JSON.parse(savedStreets);
					if (!Array.isArray(streets)) streets = [];
				} catch {
					streets = [];
				}
			}

			if (savedHouses) {
				try {
					houses = JSON.parse(savedHouses);
					if (!Array.isArray(houses)) houses = [];
				} catch {
					houses = [];
				}

				houses.forEach(ensureHouseStructure);
			}

			let hadStreetOrders = false;

			if (savedStreetOrders) {
				try {
					const parsed = JSON.parse(savedStreetOrders);

					if (parsed && typeof parsed === "object") {
						streetOrders = parsed;
						hadStreetOrders = true;
					}
				} catch {
					streetOrders = emptyStreetOrders();
				}
			}

			if (!hadStreetOrders) {
				streetOrders = emptyStreetOrders();

				DAYS.forEach(day => {
					streetOrders[day] = buildOrderFromHouseUsage(day);
				});
			}

			/*
				If an old version had every street in every day's order,
				rebuild the order from the actual house order. This fixes
				old data where F incorrectly inherited the global order.
			*/
			DAYS.forEach(day => {
				const order = Array.isArray(streetOrders[day])
					? streetOrders[day]
					: [];

				const allExisting =
					order.length === streets.length &&
					streets.every(name => order.includes(name));

				if (allExisting) {
					const usedOrder = buildOrderFromHouseUsage(day);

					if (usedOrder.length > 0) {
						streetOrders[day] = usedOrder;
					}
				}
			});

			normalizeStreetOrders();
			saveData();
		}

		function getOrderedStreets(day) {
			normalizeStreetOrders();

			return streetOrders[day].filter(streetName =>
				streetIsUsedOnDay(streetName, day)
			);
		}

		function addStreetToDayOrder(day, streetName) {
			if (!streetOrders[day].includes(streetName)) {
				streetOrders[day].push(streetName);
			}
		}

		dayView.addEventListener("change", renderList);

		function updateStats() {
			const day = statsDay.value;

			const counts = {
				VK: 0,
				HD: 0,
				NRC: 0,
				YC: 0,
				HFD: 0,
				TEL: 0,
				TR: 0,
				HP: 0,
				AD: 0,
				NYT: 0,
				F: 0
			};

			let total = 0;
			let houseCount = 0;

			houses.forEach(house => {
				ensureHouseStructure(house);

				if (house.kranten[day].length > 0) {
					houseCount++;
				}

				house.kranten[day].forEach(paper => {
					if (counts[paper] !== undefined) {
						counts[paper]++;
					}

					total++;
				});
			});

			let html = `<div style="font-size:16px;">`;

			Object.entries(counts)
				.sort((a, b) => b[1] - a[1])
				.filter(([, amount]) => amount > 0)
				.forEach(([paper, amount]) => {
					html += `
						<div style="
							display:flex;
							justify-content:space-between;
							padding:6px 0;
							border-bottom:1px solid rgba(64,224,208,.2);
						">
							<span>${paper}</span>
							<strong>${amount}</strong>
						</div>
					`;
				});

			html += `
				</div>

				<hr style="border-color:turquoise;margin:14px 0;">

				<div style="display:flex;justify-content:space-between;padding:4px 0;">
					<span>Total papers</span>
					<strong>${total}</strong>
				</div>

				<div style="display:flex;justify-content:space-between;padding:4px 0;">
					<span>Houses</span>
					<strong>${houseCount}</strong>
				</div>

				<div style="display:flex;justify-content:space-between;padding:4px 0;">
					<span>Average / house</span>
					<strong>${houseCount ? (total / houseCount).toFixed(2) : "0.00"}</strong>
				</div>
			`;

			statsContent.innerHTML = html;
		}

		function renderStreetList() {
			const oldValue = street.value;

			street.innerHTML = "";

			if (streets.length === 0) {
				const option = document.createElement("option");
				option.textContent = "Add street first";
				option.value = "";
				street.appendChild(option);
				return;
			}

			streets.forEach(name => {
				const option = document.createElement("option");
				option.value = name;
				option.textContent = name;
				street.appendChild(option);
			});

			if (streets.includes(oldValue)) {
				street.value = oldValue;
			}
		}

		function renderReferenceList() {
			reference.innerHTML = "";

			houses
				.filter(h => h.street === street.value)
				.forEach(house => {
					const option = document.createElement("option");

					const krantenText = [
						...new Set(Object.values(house.kranten).flat())
					];

					option.value = houses.indexOf(house);
					option.textContent =
						`${house.number} ${krantenText.join("/")}`;

					reference.appendChild(option);
				});
		}

		function getExportObject() {
			return {
				version: 3,
				streets,
				houses,
				streetOrders
			};
		}

		async function copyRoute() {
			const text = JSON.stringify(getExportObject());

			try {
				await navigator.clipboard.writeText(text);
				alert("Route copied!");
				exportPopup.style.display = "none";
			} catch {
				alert("Couldn't copy to the clipboard.");
			}
		}

		copyExport.addEventListener("click", copyRoute);

		statsButton.addEventListener("click", () => {
			statsDay.value = dayView.value;
			updateStats();
			statsPopup.style.display = "flex";
		});

		statsDay.addEventListener("change", updateStats);

		closeStats.addEventListener("click", () => {
			statsPopup.style.display = "none";
		});

		clearChecked.addEventListener("click", () => {
			const selectedDay = dayView.value;

			const anyChecked = houses.some(h =>
				h.checked[selectedDay]
			);

			if (!anyChecked) {
				alert("Nothing is checked.");
				return;
			}

			if (!confirm(`Clear all checked houses for ${selectedDay}?`)) {
				return;
			}

			houses.forEach(house => {
				house.checked[selectedDay] = false;
			});

			saveData();
			renderList();
		});

		function downloadRoute() {
			const text = JSON.stringify(getExportObject(), null, 2);

			const blob = new Blob([text], {
				type: "application/json"
			});

			const url = URL.createObjectURL(blob);
			const a = document.createElement("a");

			a.href = url;
			a.download = "krantenwijk-backup.json";

			document.body.appendChild(a);
			a.click();
			a.remove();

			setTimeout(() => URL.revokeObjectURL(url), 1000);

			exportPopup.style.display = "none";
		}

		function startLongPress(streetName) {
			cancelLongPress();

			longPressTimer = setTimeout(() => {
				longPressTimer = null;
				openReorderMode(streetName);
			}, 3000);
		}

		function cancelLongPress() {
			if (longPressTimer) {
				clearTimeout(longPressTimer);
				longPressTimer = null;
			}
		}

		function openReorderMode(streetName) {
			reorderDay = dayView.value;

			normalizeStreetOrders();

			/*
				Only streets actually used on this day are reorderable.
			*/
			reorderTemp = [...getOrderedStreets(reorderDay)];

			if (!reorderTemp.length) {
				return;
			}

			reorderPopup.style.display = "flex";
			renderReorderList();

			setTimeout(() => {
				const item = [...reorderList.children]
					.find(el => el.dataset.street === streetName);

				if (item) {
					item.scrollIntoView({
						behavior: "smooth",
						block: "center"
					});
				}
			}, 50);
		}

		function moveReorderItem(index, direction) {
			const newIndex = index + direction;

			if (
				newIndex < 0 ||
				newIndex >= reorderTemp.length
			) {
				return;
			}

			[
				reorderTemp[index],
				reorderTemp[newIndex]
			] = [
				reorderTemp[newIndex],
				reorderTemp[index]
			];

			renderReorderList();
		}

		function renderReorderList() {
			reorderList.innerHTML = "";

			reorderTemp.forEach((streetName, index) => {
				const item = document.createElement("div");
				item.className = "reorderItem";
				item.dataset.street = streetName;

				const name = document.createElement("div");
				name.className = "reorderName";
				name.textContent = `${index + 1}. ${streetName}`;
				name.draggable = true;

				const up = document.createElement("button");
				up.className = "reorderMove";
				up.textContent = "↑";
				up.title = "Move up";

				const down = document.createElement("button");
				down.className = "reorderMove";
				down.textContent = "↓";
				down.title = "Move down";

				up.disabled = index === 0;
				down.disabled = index === reorderTemp.length - 1;

				up.addEventListener("click", () => {
					moveReorderItem(index, -1);
				});

				down.addEventListener("click", () => {
					moveReorderItem(index, 1);
				});

				let draggedStreet = null;

				name.addEventListener("dragstart", event => {
					draggedStreet = streetName;
					item.classList.add("dragging");

					event.dataTransfer.effectAllowed = "move";
					event.dataTransfer.setData(
						"text/plain",
						streetName
					);
				});

				name.addEventListener("dragend", () => {
					item.classList.remove("dragging");
				});

				item.addEventListener("dragover", event => {
					event.preventDefault();
					item.classList.add("streetDropTarget");
				});

				item.addEventListener("dragleave", () => {
					item.classList.remove("streetDropTarget");
				});

				item.addEventListener("drop", event => {
					event.preventDefault();
					item.classList.remove("streetDropTarget");

					const dragged =
						event.dataTransfer.getData("text/plain") ||
						draggedStreet;

					if (!dragged || dragged === streetName) {
						return;
					}

					const from = reorderTemp.indexOf(dragged);
					const to = reorderTemp.indexOf(streetName);

					if (from === -1 || to === -1) {
						return;
					}

					reorderTemp.splice(from, 1);
					reorderTemp.splice(to, 0, dragged);

					renderReorderList();
				});

				item.appendChild(name);
				item.appendChild(up);
				item.appendChild(down);

				reorderList.appendChild(item);
			});
		}

		cancelReorder.addEventListener("click", () => {
			reorderPopup.style.display = "none";
			reorderDay = null;
			reorderTemp = [];
		});

		saveReorder.addEventListener("click", () => {
			if (!reorderDay) return;

			streetOrders[reorderDay] = [...reorderTemp];

			saveData();
			renderList();

			reorderPopup.style.display = "none";
			reorderDay = null;
			reorderTemp = [];
		});

		function renderList() {
			houseList.innerHTML = "";

			const selectedDay = dayView.value;
			const orderedStreets = getOrderedStreets(selectedDay);

			if (orderedStreets.length === 0) {
				const empty = document.createElement("p");
				empty.style.color = "#777";
				empty.textContent = "No streets used on this day.";
				houseList.appendChild(empty);

				renderReferenceList();
				return;
			}

			let idCounter = 0;

			orderedStreets.forEach(streetName => {
				const visibleHouses = houses.filter(h =>
					h.street === streetName &&
					h.kranten[selectedDay].length > 0
				);

				if (!visibleHouses.length) {
					return;
				}

				const heading = document.createElement("h2");
				heading.textContent = streetName;
				heading.className = "streetHeading";

				/*
					3-second long press opens reorder mode.
					Pointer events work for mouse, touchscreen and
					stylus without needing separate mouse/touch logic.
				*/
				heading.addEventListener("pointerdown", event => {
					if (event.button !== undefined && event.button !== 0) {
						return;
					}

					startLongPress(streetName);
				});

				["pointerup", "pointercancel", "pointerleave"].forEach(type => {
					heading.addEventListener(type, cancelLongPress);
				});

				heading.addEventListener("contextmenu", event => {
					event.preventDefault();
				});

				houseList.appendChild(heading);

				visibleHouses.forEach(house => {
					ensureHouseStructure(house);

					const li = document.createElement("li");

					const uniqueId =
						`chk-${idCounter++}`;

					li.innerHTML = `
						<div class="houseLeft">
							<input type="checkbox" id="${uniqueId}">
							<label for="${uniqueId}">
								<strong>
									${house.number} ${house.kranten[selectedDay].join("/")}
								</strong>
							</label>
						</div>
						<button class="deleteHouse">x</button>
					`;

					const checkbox = li.querySelector("input");

					checkbox.checked =
						house.checked[selectedDay];

					checkbox.addEventListener("change", () => {
						house.checked[selectedDay] =
							checkbox.checked;

						saveData();
					});

					li.querySelector(".deleteHouse")
						.addEventListener("click", () => {
							const confirmed = confirm(
								`Delete house ${house.number} (${house.kranten[selectedDay].join("/")})?`
							);

							if (!confirmed) return;

							/*
								Keep the original delete behavior:
								delete the whole house.
							*/
							houses.splice(
								houses.indexOf(house),
								1
							);

							normalizeStreetOrders();
							saveData();
							renderList();
						});

					houseList.appendChild(li);
				});
			});

			renderReferenceList();
		}

		importFile.addEventListener("change", function() {
			const fileName =
				this.files[0]?.name ||
				"No file selected";

			document.getElementById("fileName").textContent =
				fileName;
		});

		action.addEventListener("change", () => {
			referenceContainer.style.display =
				action.value === "bij"
					? "inline"
					: "none";

			renderReferenceList();
		});

		addStreet.addEventListener("click", () => {
			const name = prompt("Street name:");

			if (!name) return;

			const cleanName = name.trim();

			if (!cleanName) return;

			if (streets.includes(cleanName)) {
				alert("Street already exists.");
				return;
			}

			streets.push(cleanName);

			/*
				Do NOT add the new street to every day's order here.

				A street only becomes part of a day's route when a
				house with newspapers is added to that day.

				This is what allows:
				Ma-Wo: 1,2,3
				F:     3,2,1
			*/

			saveData();
			renderStreetList();

			street.value = cleanName;

			renderList();
		});

		importFile.addEventListener("change", () => {
			const file = importFile.files[0];

			if (!file) return;

			const reader = new FileReader();

			reader.onload = () => {
				importText.value = reader.result;
			};

			reader.readAsText(file);
		});

		downloadExport.addEventListener("click", downloadRoute);

		removeStreet.addEventListener("click", () => {
			if (!street.value) return;

			const name = street.value;
			const amount = houses.filter(
				h => h.street === name
			).length;

			if (amount > 0) {
				if (!confirm(
					"This street still has houses. Delete everything?"
				)) {
					return;
				}

				houses = houses.filter(
					h => h.street !== name
				);
			} else {
				if (!confirm("Delete street?")) {
					return;
				}
			}

			streets = streets.filter(
				streetName => streetName !== name
			);

			DAYS.forEach(day => {
				streetOrders[day] =
					streetOrders[day].filter(
						streetName => streetName !== name
					);
			});

			saveData();
			renderStreetList();
			renderList();
		});

		street.addEventListener("change", renderReferenceList);

		function getSelectedDayGroups() {
			switch (days.value) {
				case "mawo":
					return ["mawo"];

				case "week":
					return ["mawo", "dovr", "za"];

				case "dovr":
					return ["dovr"];

				case "doza":
					return ["dovr", "za"];

				case "za":
					return ["za"];

				case "f":
					return ["f"];

				default:
					return [];
			}
		}

		function importRoute(data, mode, day) {
			if (
				!data ||
				!Array.isArray(data.streets) ||
				!Array.isArray(data.houses)
			) {
				alert("Invalid route data.");
				return;
			}

			const daysToImport = day === "all"
				? ["mawo", "dovr", "za", "f"]
				: [day];

			if (mode === "replace") {
				if (day === "all") {
					streets = [...data.streets];
					houses = [];
					streetOrders = emptyStreetOrders();
				} else {
					houses.forEach(ensureHouseStructure);

					houses.forEach(house => {
						daysToImport.forEach(d => {
							house.kranten[d] = [];
							house.checked[d] = false;
						});
					});

					houses = houses.filter(house =>
						DAYS.some(d =>
							house.kranten[d].length > 0
						)
					);

					streetOrders[day] = [];
				}
			}

			data.streets.forEach(name => {
				if (!streets.includes(name)) {
					streets.push(name);
				}
			});

			/*
				Import saved per-day ordering when available.
			*/
			if (
				data.streetOrders &&
				typeof data.streetOrders === "object"
			) {
				daysToImport.forEach(d => {
					if (Array.isArray(data.streetOrders[d])) {
						if (mode === "replace") {
							streetOrders[d] =
								data.streetOrders[d].filter(name =>
									streets.includes(name)
								);
						} else {
							data.streetOrders[d].forEach(name => {
								if (
									streets.includes(name) &&
									!streetOrders[d].includes(name)
								) {
									streetOrders[d].push(name);
								}
							});
						}
					}
				});
			}

			data.houses.forEach(importedHouse => {
				const importedKranten =
					importedHouse.kranten;

				let existing = houses.find(h =>
					h.street === importedHouse.street &&
					h.number == importedHouse.number
				);

				if (!existing) {
					existing = {
						street: importedHouse.street,
						number: importedHouse.number,
						checked: {
							mawo: false,
							dovr: false,
							za: false,
							f: false
						},
						kranten: {
							mawo: [],
							dovr: [],
							za: [],
							f: []
						}
					};

					houses.push(existing);
				}

				ensureHouseStructure(existing);

				daysToImport.forEach(d => {
					const importedPapers =
						importedKranten &&
						Array.isArray(importedKranten[d])
							? importedKranten[d]
							: [];

					importedPapers.forEach(paper => {
						if (!existing.kranten[d].includes(paper)) {
							existing.kranten[d].push(paper);
						}
					});

					existing.kranten[d].sort();

					if (
						existing.kranten[d].length > 0 &&
						!streetOrders[d].includes(existing.street)
					) {
						streetOrders[d].push(existing.street);
					}
				});
			});

			normalizeStreetOrders();
			saveData();
			renderStreetList();
			renderList();

			alert("Import complete.");
		}

		submit.addEventListener("click", () => {
			if (!street.value) {
				alert("Add a street first.");
				return;
			}

			const number = houseNumber.value.trim();

			if (number === "") {
				alert("Enter a house number.");
				return;
			}

			const selectedKrant = krant.value;
			const selectedDays = getSelectedDayGroups();

			if (action.value === "add") {

				let existing = houses.find(
					h => h.street === street.value &&
					h.number == number
				);

				if (existing) {

					selectedDays.forEach(day => {
						if (!existing.kranten[day].includes(selectedKrant)) {
							existing.kranten[day].push(selectedKrant);
							existing.kranten[day].sort();
						}
					});

				} else {

					let newHouse = {
						street: street.value,
						number: number,
						checked: {
							mawo: false,
							dovr: false,
							za: false,
							f: false
						},
						kranten: {
							mawo: [],
							dovr: [],
							za: [],
							f: []
						}
					};

					selectedDays.forEach(day => {
						newHouse.kranten[day].push(selectedKrant);
					});

					houses.push(newHouse);
				}

				selectedDays.forEach(day => {
					addStreetToDayOrder(day, street.value);
				});

			} else if (action.value === "bij") {

				let existing = houses.find(
					h => h.street === street.value &&
					h.number == number
				);

				if (existing) {

					selectedDays.forEach(day => {
						if (!existing.kranten[day].includes(selectedKrant)) {
							existing.kranten[day].push(selectedKrant);
							existing.kranten[day].sort();
						}
					});

				} else {

					let newHouse = {
						street: street.value,
						number: number,
						checked: {
							mawo: false,
							dovr: false,
							za: false,
							f: false
						},
						kranten: {
							mawo: [],
							dovr: [],
							za: [],
							f: []
						}
					};

					selectedDays.forEach(day => {
						newHouse.kranten[day].push(selectedKrant);
					});

					let referenceHouse = parseInt(reference.value);

					if (isNaN(referenceHouse)) {
						houses.push(newHouse);
					} else {
						houses.splice(referenceHouse, 0, newHouse);
					}
				}

				selectedDays.forEach(day => {
					addStreetToDayOrder(day, street.value);
				});

			} else if (action.value === "af") {

				let existing = houses.find(
					h => h.street === street.value &&
					h.number == number
				);

				if (!existing) {
					alert("House not found.");
					return;
				}

				selectedDays.forEach(day => {
					let index =
						existing.kranten[day]
							.indexOf(selectedKrant);

					if (index !== -1) {
						existing.kranten[day]
							.splice(index, 1);
					}
				});

				const hasAnyKranten =
					existing.kranten.mawo.length ||
					existing.kranten.dovr.length ||
					existing.kranten.za.length ||
					existing.kranten.f.length;

				if (!hasAnyKranten) {
					houses.splice(
						houses.indexOf(existing),
						1
					);
				}
			}

			normalizeStreetOrders();
			saveData();
			renderList();

			houseNumber.value = "";
			houseNumber.focus();
		});

		exportData.addEventListener("click", () => {
			exportPopup.style.display = "flex";
		});

		cancelImport.addEventListener("click", () => {
			importPopup.style.display = "none";
			importText.value = "";
		});

		cancelExport.addEventListener("click", () => {
			exportPopup.style.display = "none";
		});

		confirmImport.addEventListener("click", () => {
			let data;

			try {
				data = JSON.parse(importText.value);
			} catch {
				alert("Invalid route data.");
				return;
			}

			importRoute(
				data,
				importMode.value,
				importDays.value
			);

			importPopup.style.display = "none";
			importText.value = "";
		});

		importData.addEventListener("click", () => {
			importPopup.style.display = "flex";
		});

		/*
			Close popups when tapping the dark background.
		*/
		[
			importPopup,
			exportPopup,
			statsPopup,
			reorderPopup
		].forEach(popup => {
			popup.addEventListener("click", event => {
				if (event.target === popup) {
					popup.style.display = "none";

					if (popup === reorderPopup) {
						reorderDay = null;
						reorderTemp = [];
					}
				}
			});
		});

		loadData();

		/*
			Automatically select the relevant route for today.
			Sunday falls back to Ma-Wo.
		*/
		const today = new Date().getDay();

		if (today >= 1 && today <= 3) {
			dayView.value = "mawo";
		} else if (today >= 4 && today <= 5) {
			dayView.value = "dovr";
		} else if (today === 6) {
			dayView.value = "za";
		} else {
			dayView.value = "mawo";
		}

		renderStreetList();
		renderList();
	</script>

</body>
</html>
